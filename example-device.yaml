# =============================================================================
# Example device configuration — Thermotec / PHNIX Pool Heat Pump proxy
# =============================================================================
#
# This is the ONLY file you need to create on your own ESPHome dashboard.
# It pulls the full firmware from GitHub as a remote "package", so you never
# have to copy/paste the main YAML — and you get fixes and new features just
# by recompiling.
#
# HOW TO USE
#   1. Copy this file into your ESPHome config directory (or paste it into the
#      ESPHome dashboard "New device" editor) and rename it to something like
#      `pool-heatpump.yaml`.
#   2. Add the required entries to your `secrets.yaml` (see the README §
#      "Configure secrets.yaml").
#   3. Override any substitutions below to match your setup.
#   4. Compile and flash.
#
# CHOOSING A VERSION (the `ref:` field in the package below)
#   - `main`            → the latest STABLE release. Recommended for most users.
#   - `vX.Y.Z`          → a specific stable release, pinned. Use this if you
#                         want full control over when you take updates (it will
#                         never change under you). See the repo's Releases page.
#   - a feature branch  → the latest IN-DEVELOPMENT code (e.g. testing a fix
#     name                before it's merged). Expect rough edges.
#
# After changing `ref:`, recompile. ESPHome re-fetches per the `refresh:`
# interval below; run `esphome clean` (or the dashboard "Clean Build Files")
# to force an immediate re-pull.
# =============================================================================

substitutions:
  # ── Identity ────────────────────────────────────────────────────────────
  # Lower-case, hyphenated. Becomes the ESPHome node/hostname.
  device_name: pool-heatpump-proxy
  friendly_name: Pool Heatpump Proxy

  # ── Required secrets ──────────────────────────────────────────────────────
  # The upstream package (pool-heatpump-proxy.yaml) can't use `!secret`
  # itself — it's fetched and compiled standalone by some remote/CI build
  # servers, which never see your secrets.yaml. It only defines placeholder
  # defaults for these; THIS block is what actually wires in your real
  # values, via `!secret` lookups resolved against the secrets.yaml next to
  # THIS file. Add the matching entries to your secrets.yaml — see the
  # README "Configure secrets.yaml" — and do not remove any of these seven.
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_fallback_password: !secret ap_fallback_password
  ota_password: !secret ota_password
  mqtt_broker: !secret mqtt_broker
  mqtt_username: !secret mqtt_username
  mqtt_password: !secret mqtt_password

  # ── Heat pump BLE MAC address (required) ──────────────────────────────────
  # NOT a secret — just per-installation config, so it's a plain value here
  # rather than a secrets.yaml/!secret lookup. Format AA:BB:CC:DD:EE:FF; find
  # it via the AquaTemp app's device info screen (see the README § "Find your
  # heat pump's BLE MAC address"). Can't find it there? Leave the placeholder
  # below and flash anyway — the ESPHome logs will show nearby BLE devices;
  # look for one named BLUENRG-XXXXXX, then update this and reflash.
  pool_heatpump_proxy_device_mac_address: "AA:BB:CC:DD:EE:FF"

  # ── MQTT (port only) ──────────────────────────────────────────────────────
  # The device talks to Home Assistant over MQTT and publishes its own entities
  # via discovery — no HA helpers or template entities to create. The broker
  # host and credentials are the mqtt_* secrets set above. Only override the
  # port here, for a non-standard broker port (default 1883):
  # mqtt_port: "1883"

  # ── Protocol component version (optional) ─────────────────────────────────
  # The firmware pulls a small protocol codec (`phnix`) from this same repo via
  # `external_components`. Keep it on the SAME ref as the package `ref:` below
  # (both default to `main`). Override only when testing a feature branch — set
  # it to the same branch name you point `ref:` at:
  # phnix_components_ref: main

  # ── Deep sleep on/off (optional) ──────────────────────────────────────────
  # Set to "false" for a mains/USB-powered install: the device never sleeps and
  # polls continuously. Leave unset (or "true") for battery operation.
  # enable_deep_sleep: "true"

  # ── Sleep schedule (optional; ignored when enable_deep_sleep is "false") ───
  # deep_sleep_duration_day: 5min
  # deep_sleep_duration_night: 15min
  # day_start_hour: "9"
  # day_end_hour: "18"

  # ── Recovery / self-heal (optional) ───────────────────────────────────────
  # Consecutive failed wakes (can't reach the heat pump) after which the device
  # stays awake in "recovery mode" so it's reachable for OTA instead of
  # sleep-looping. Raise to make it less eager; very high to effectively disable.
  # safe_mode_failure_threshold: "3"
  # Double-reset the board's reset button to force always-on mode (no serial /
  # no HA needed) — physical recovery when WiFi/MQTT won't come up. "false"
  # disables it (avoids two small extra flash writes per wake).
  # enable_double_reset_wake: "true"

  # ── Hardware / board (optional) ───────────────────────────────────────────
  # Defaults target the DFRobot FireBeetle 2 ESP32-C6. Override for a
  # different ESP32 board. See the README § "Using a different ESP32 board".
  # esp_board: dfrobot_firebeetle2_esp32c6
  # esp_variant: ESP32C6
  # battery_adc_pin: GPIO0
  # battery_voltage_multiplier: "2.0"   # 1.0 if your board has no divider

  # ── Battery percentage calibration (optional) ─────────────────────────────
  # Voltage endpoints for the 0%/100% curve. LiPo cells sag hard under load
  # near empty (the "cliff"), so if your device dies while Battery Level
  # still reads well above 0%, raise battery_voltage_empty to match the
  # voltage it actually collapses at. See the README § "Battery calibration".
  # battery_voltage_empty: "3.0"
  # battery_voltage_full: "4.2"

  # ── Optional external water temperature probe ─────────────────────────────
  # Wire a DS18B20 (1-Wire) probe — e.g. dropped in the pool — to a free GPIO
  # pin to get a "Pool Water Temperature" entity, distinct from the heat
  # pump's own Inlet/Outlet Water Temperature. Optional: leave unwired and the
  # entity just stays unavailable. See the README §
  # "Optional: external water temperature probe".
  # water_temp_sensor_pin: GPIO2

# ── Remote package: the actual firmware, pulled from GitHub ─────────────────
packages:
  thermotec_heatpump:
    url: https://github.com/a-teece/thermotec-mini-heat-pump-home-assistant-integration
    ref: main                       # see "CHOOSING A VERSION" above
    files: [pool-heatpump-proxy.yaml]
    refresh: 1d                      # how often to re-check GitHub for updates
    # NOTE: if you change `ref:` away from `main`, also set the
    # `phnix_components_ref` substitution above to the same value, so the
    # protocol component is fetched from the matching ref.
