# ─── Globals ────────────────────────────────────────────────────────────────
# ─── Required Secrets ───────────────────────────────────────────────────────
# These secrets are required in your secrets.yaml file which can easily be
# edited in the ESP Home dashboard (top right).
#  wifi_ssid: "your WiFi network name"
#  wifi_password: "your WiFi network key"
#  ap_fallback_password: "a strong password for the fallback WiFi hotspot, e.g. my_secure_fallback_password"
#  ota_password: "a strong password for OTA updates, e.g. my_very_secure_password"
#  pool_heatpump_proxy_device_mac_address: "your heat pump's BLE MAC address, e.g. AA:BB:CC:DD:EE:FF"
#  mqtt_broker: "your MQTT broker host, e.g. homeassistant.local or 192.168.1.x"
#  mqtt_username: "your MQTT broker username"
#  mqtt_password: "your MQTT broker password"

# ─── Globals ────────────────────────────────────────────────────────────────
substitutions:
  device_name: pool-heatpump-proxy
  friendly_name: Pool Heatpump Proxy

  # Git ref the `phnix` protocol component is fetched from (external_components
  # below). Defaults to the stable `main`; point it at a feature branch to test
  # in-development protocol code. Should normally track the package `ref:` you
  # set in your device file.
  phnix_components_ref: main

  # Version of THIS firmware package (not the heat pump's controller firmware —
  # that's the Master Program Version sensor). Surfaced as the "Bridge Firmware
  # Version" diagnostic text sensor and in the boot log via the esphome
  # `project:` block, so you can tell what a device is actually running (the
  # remote-package + build-cache flow makes that otherwise invisible). Bumped
  # as part of cutting each release (see CLAUDE.md); matches the most recent
  # CHANGELOG version heading the build includes. NOT a consumer knob — do not
  # override it in your device file, or the sensor will misreport.
  firmware_version: "2.4.0"

  # MQTT broker port (the device's Home Assistant transport — see CHANGELOG /
  # the v2.0.0 MQTT transition). The broker host and credentials live in
  # secrets.yaml (mqtt_broker / mqtt_username / mqtt_password) so the whole
  # connection is configured in one place without editing this file; only
  # override the port here for a non-standard broker port.
  mqtt_port: "1883"

  service_uuid: "0000ff01-0000-1000-8000-00805f9b34fb"
  write_char_uuid: "0000ff03-0000-1000-8000-00805f9b34fb"
  notify_char_uuid: "0000ff02-0000-1000-8000-00805f9b34fb"

  # Control entities (Power, Mode, Target Temperature, Prevent Deep Sleep) are
  # published to Home Assistant via MQTT discovery — there are no HA helpers or
  # template entities to create. See the control entities further down.

  # Permanently enable ("true") or disable ("false") deep sleep.
  # "false" = always-on mode: the device never sleeps and polls continuously
  # (every 30 s) — intended for mains/USB-powered installs where battery life
  # isn't a concern. This is a build-time choice and overrides the runtime
  # "Prevent Deep Sleep" switch. Leave "true" for battery operation.
  enable_deep_sleep: "true"

  # Sleep duration during "day" hours (between day_start_hour and day_end_hour).
  # Use shorter durations during the hours when you're likely to adjust settings.
  # Valid units: s (seconds), min (minutes), h (hours). E.g. "10min", "1h".
  # (Ignored when enable_deep_sleep is "false".)
  deep_sleep_duration_day: 5min

  # Sleep duration during "night" hours (outside the day window).
  # Longer duration saves battery overnight when changes are unlikely.
  deep_sleep_duration_night: 15min

  # Start and end of the "day" window in 24-hour whole hours (0–23).
  # day_start_hour: device uses deep_sleep_duration_day from this hour onward.
  # day_end_hour:   device switches back to deep_sleep_duration_night at this hour.
  # Example: "9" and "18" = 09:00–17:59 day mode, 18:00–08:59 night mode.
  # Has no effect if the Prevent Deep Sleep switch is on (USB / always-on mode).
  day_start_hour: "9"
  day_end_hour: "18"

  # ─── Recovery / self-heal safeguards ────────────────────────────────────────
  # A deep-sleep device is unreachable most of the time, so a bad state could
  # otherwise only be cleared by a physical serial re-flash. These make it
  # recoverable over-the-air.

  # Consecutive wake cycles that fail to complete a poll + reconcile (BLE never
  # connects, or the reconcile never finishes) after which the device stops
  # sleeping and stays awake in "recovery mode" — so a bridge that can reach
  # MQTT but not the heat pump stays reachable for OTA/diagnosis instead of
  # sleep-looping out of reach. Auto-clears on the first successful wake. Note a
  # long BLE contention with the AquaTemp app can also trip it; raise this to
  # make recovery mode less eager, or set very high to effectively disable.
  safe_mode_failure_threshold: "3"

  # Double-reset-to-stay-awake: press the board's reset button twice while it is
  # awake to force always-on mode with no serial and no HA — the physical
  # recovery path for when WiFi/MQTT itself won't come up. A normal single
  # reset / power-cycle returns to normal sleeping. "false" disables it (and
  # avoids its two small extra flash writes per wake).
  enable_double_reset_wake: "true"

  # ─── Hardware / board ───────────────────────────────────────────────────────
  # These default to the DFRobot FireBeetle 2 ESP32-C6 (the reference board).
  # When consuming this file as a remote ESPHome package, override any of these
  # in your own device YAML to target a different ESP32 board — no need to fork.

  # ESPHome board identifier and chip variant for the esp32: component.
  # e.g. esp32dev / ESP32, esp32-s3-devkitc-1 / ESP32S3.
  esp_board: dfrobot_firebeetle2_esp32c6
  esp_variant: ESP32C6

  # Battery monitoring (FireBeetle 2 specifics).
  # battery_adc_pin: the ADC pin wired to the battery sense line. The
  #   FireBeetle 2 exposes the cell voltage (via a divider) on GPIO0. Set to a
  #   valid ADC pin for your board.
  # battery_voltage_multiplier: compensates for the onboard voltage divider.
  #   The FireBeetle 2 has a 1:1 divider, so 2.0 restores the true cell
  #   voltage. Use your board's divider ratio, or "1.0" if it has no divider.
  # To disable battery monitoring entirely on a board without a battery, see
  # the README ("Using a different ESP32 board").
  battery_adc_pin: GPIO0
  battery_voltage_multiplier: "2.0"

  # battery_voltage_empty / battery_voltage_full: the two endpoints of the
  # linear voltage-to-percentage curve used by the Battery Level sensor
  # (0% at empty, 100% at full). Defaults (3.0V / 4.2V) are typical single-cell
  # LiPo limits, but LiPo cells don't discharge linearly — voltage sags hard
  # under load ("the cliff") once the cell nears empty, so a device can
  # brown out at a voltage well above where a resting-voltage curve would
  # predict. A real capture from this project's reference unit: voltage
  # declined gently from 3.76V to 3.00V over ~2 days, then collapsed to 2.61V
  # in about 12 minutes, and the device stayed dark for almost 15 hours
  # before recovering. If your device dies while Battery Level still reads
  # well above 0%, pull your own `*_battery_voltage` entity's history (e.g.
  # via a Home Assistant history/logbook query) to find the actual collapse
  # voltage, and raise battery_voltage_empty to just above it — this won't
  # give you more runtime, but it makes 0% mean "about to die" instead of
  # "already collapsing". For advance warning before the cliff, build a Home
  # Assistant automation on Battery Voltage or Battery Level rather than
  # waiting for 0% (see the README).
  battery_voltage_empty: "3.0"
  battery_voltage_full: "4.2"

  # ─── Optional external water temperature probe ─────────────────────────────
  # A DS18B20 (or other 1-Wire) probe on a single, customizable GPIO pin —
  # e.g. dropped directly into the pool/spa water, independent of the heat
  # pump's own Inlet/Outlet Water Temperature sensors (which read the heat
  # pump's internal plumbing over BLE, not the pool itself). This is entirely
  # optional hardware: if you don't wire a probe, the "Pool Water Temperature"
  # entity simply stays unavailable — nothing else in the firmware depends on
  # it. Needs a ~4.7kΩ pull-up resistor between the data line and 3.3V
  # (standard 1-Wire wiring). Check your board's pinout before overriding —
  # avoid any pin already used by another substitution (e.g. battery_adc_pin).
  water_temp_sensor_pin: GPIO2

# ─── Globals ────────────────────────────────────────────────────────────────
globals:
  # Tracks whether the BLE link to the heat pump is up.
  # Used by on_boot to wait until connected before sleeping.
  # NOT restored — BLE state from a previous wake cycle is meaningless.
  - id: ble_connected
    type: bool
    initial_value: 'false'
    restore_value: no

  # Tracks whether the MQTT broker connection is up (set from mqtt on_connect/
  # on_disconnect). on_boot waits on this before reconciling — the role
  # api.connected used to play.
  - id: mqtt_connected
    type: bool
    initial_value: 'false'
    restore_value: no

  # Counts write attempts within a single sync_* run so each verify-and-retry
  # loop has a bounded number of tries. Reset at the start of each run; not
  # meaningful across wakes.
  - id: power_sync_attempts
    type: int
    initial_value: '0'
    restore_value: no
  - id: target_sync_attempts
    type: int
    initial_value: '0'
    restore_value: no
  - id: mode_sync_attempts
    type: int
    initial_value: '0'
    restore_value: no

  # Set true by an mqtt on_message the instant the broker (re)delivers the
  # retained "Prevent Deep Sleep" command on a wake. on_boot waits on this
  # before the sleep decision, so a "stay awake" request made while the device
  # slept is applied deterministically instead of racing — and losing to — the
  # sleep decision. NOT restored: re-evaluated fresh each wake.
  - id: prevent_cmd_received
    type: bool
    initial_value: 'false'
    restore_value: no

  # Forces always-awake for THIS boot session only, set by the double-reset
  # detector. NOT restored, so a normal single reset / power-cycle clears it.
  - id: force_awake
    type: bool
    initial_value: 'false'
    restore_value: no

  # True while the device is in self-heal recovery mode (staying awake after
  # too many failed wakes). Drives the "Recovery Mode" binary sensor. NOT
  # restored.
  - id: recovery_mode
    type: bool
    initial_value: 'false'
    restore_value: no

  # True once on_boot has decided to stay awake (prevent switch on, always-on
  # build, or double-reset). Gates the Prevent Deep Sleep switch's
  # turn_off_action so it only triggers a sleep when the device is genuinely
  # awake — NOT when the switch merely restores to OFF during setup() on boot,
  # which would short-circuit straight into deep sleep before WiFi/SNTP/BLE are
  # up (wrong sleep duration — night fallback — and no heat-pump poll). NOT
  # restored.
  - id: staying_awake
    type: bool
    initial_value: 'false'
    restore_value: no

  # Set true by on_connect once it has finished reconciling HA helpers with
  # the heat pump (including any power-state retries). on_boot waits on this
  # before sleeping, so the device stays awake exactly as long as the
  # reconcile needs — no longer, no shorter. NOT restored.
  - id: reconcile_done
    type: bool
    initial_value: 'false'
    restore_value: no

  # Last successful HA-sync timestamp ("YYYY-MM-DD HH:MM:SS"), RETAINED across
  # deep sleep so the heartbeat survives a power-cycle / OTA on the device side
  # too (the MQTT broker also retains the last published value for HA). This is
  # the only template sensor still backed by a restored global; the BLE-derived
  # sensors rely on MQTT's retained state topics instead.
  # Stored as a fixed char array (trivially copyable → safely restorable;
  # std::string globals can't be restored). Zero-initialised on first-ever
  # boot, so an empty first byte means "nothing stored yet". Persisted to
  # flash by global_preferences->sync() just before deep sleep.
  - id: last_connected_str
    # 32, not 20 (the actual "YYYY-MM-DD HH:MM:SS\0" length): ESPTime's year
    # field is uint16_t, so GCC's -Wformat-truncation sizes %04d for its full
    # 5-digit worst case (65535) and flags char[24] as too small to prove safe.
    type: char[32]
    restore_value: yes

  # Consecutive failed wake cycles (BLE never connected or reconcile never
  # finished). Reset to 0 on any successful wake; when it reaches
  # ${safe_mode_failure_threshold} the device enters recovery mode (stays awake
  # for OTA) instead of sleeping. Restored across deep sleep / power-cycle so
  # the count is not lost between wakes; persisted by the
  # global_preferences->sync() already run before each sleep.
  - id: consecutive_failures
    type: int
    initial_value: '0'
    restore_value: yes

  # Double-reset detector. Armed (set true) early each boot and cleared just
  # before a *clean* deep-sleep entry. If the board is reset while still awake
  # the flag survives, so the next boot sees it still set → double reset →
  # force always-awake. Restored across deep sleep / power-cycle.
  - id: drd_flag
    type: bool
    initial_value: 'false'
    restore_value: yes

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Stamps the firmware version into the boot log ("Project
  # a-teece.thermotec-pool-heatpump version …") — the quickest way to check
  # what a device is running from the ESPHome dashboard logs.
  project:
    name: "a-teece.thermotec-pool-heatpump"
    version: ${firmware_version}
  on_boot:
    # Run after WiFi/API are initialized but before deep_sleep enters.
    # Priority -100 places us late in the boot sequence.
    priority: -100.0
    then:
      # ── Phase 0a: Double-reset → force always-awake (physical recovery) ──
      # drd_flag is armed below on every boot and cleared only on a *clean*
      # deep-sleep entry. So if it is already set here, the previous boot never
      # reached a clean sleep — i.e. the board was reset again while awake:
      # treat that as a double-reset request and stay awake for OTA/config (no
      # serial or HA needed — the recovery path for when WiFi/MQTT is the
      # problem). A normal single reset / power-cycle leaves force_awake false.
      - if:
          condition:
            lambda: 'return ${enable_double_reset_wake};'
          then:
            - if:
                condition:
                  lambda: 'return id(drd_flag);'
                then:
                  - lambda: |-
                      id(force_awake) = true;
                      id(drd_flag) = false;   // disarm so a later single reset returns to sleeping
                  - logger.log:
                      level: INFO
                      format: "Double-reset detected — staying awake (recovery mode)"
                else:
                  - lambda: 'id(drd_flag) = true;'   # arm for this boot; cleared on clean sleep
            - lambda: 'global_preferences->sync();'

      # ── Phase 0: Republish Last Connected before MQTT connects ───────────
      # BLE-derived sensor values survive deep sleep via MQTT's retained state
      # topics — the broker re-delivers each entity's last value to HA on
      # (re)subscribe — so they no longer need snapshotting into restored
      # globals and republishing here. Last Connected is the only template
      # sensor still backed by a restored global (last_connected_str), so
      # republish it from that global now; on_time_sync refreshes it with a
      # fresh stamp ~13 s into the wake.
      - if:
          condition:
            lambda: 'return id(last_connected_str)[0] != ''\0'';'
          then:
            - component.update: last_connected
      # Publish the firmware version once per wake (constant until reflash;
      # MQTT retains it for HA, like every other state topic).
      - component.update: bridge_firmware_version

      # ── Phase 1: Wait for the MQTT broker ───────────────────────────────
      # We need the broker up so it can re-deliver the retained control
      # commands (desired power/mode/target) before we decide whether to sleep.
      - wait_until:
          condition:
            lambda: 'return id(mqtt_connected);'
          timeout: 15s

      # ── Phase 2: Wait for the retained control commands to be delivered ──
      # The broker re-sends the retained command topics on (re)subscribe. Wait
      # until the retained Prevent Deep Sleep command specifically has landed
      # (prevent_cmd_received) rather than guessing a fixed delay — this is what
      # makes a "stay awake" request set while the device slept take effect on
      # the very next wake instead of racing, and losing to, the sleep decision
      # below. command_retain guarantees the command exists, so this normally
      # returns in well under a second; the 5s timeout is only a first-ever-boot
      # safety net (no command retained yet). A short settle then lets the other
      # retained commands (power/mode/target) arrive before on_connect reads them.
      - wait_until:
          condition:
            lambda: 'return id(prevent_cmd_received);'
          timeout: 5s
      - delay: 1s

      # ── Phase 3: Decide between awake mode and a sleep cycle ────────────
      - if:
          condition:
            # Stay awake if the runtime helper says so, OR if deep sleep is
            # disabled at build time (enable_deep_sleep: "false" → always-on).
            or:
              - switch.is_on: prevent_deep_sleep_switch
              - lambda: 'return !(${enable_deep_sleep});'
              # Double-reset physical recovery (Phase 0a).
              - lambda: 'return id(force_awake);'
          then:
            # ── AWAKE MODE: stay on (always-on build, OTA, debugging) ───
            - deep_sleep.prevent: deep_sleep_1
            # Mark that we are genuinely awake, so the Prevent Deep Sleep
            # switch's turn_off_action may enter sleep on a real toggle — but a
            # boot-time restore of the switch to OFF cannot (see the switch).
            - lambda: 'id(staying_awake) = true;'
            - logger.log:
                level: INFO
                format: "Staying awake — deep sleep disabled or prevented"
            # The interval timer below handles continuous 30s polling.
          else:
            # ── SLEEP CYCLE: wake → connect → sync target → sleep ───────

            # Phase 4: Wait for BLE link to the heat pump.
            # auto_connect starts scanning at boot. Connection usually
            # completes in 5-15s depending on RF conditions.
            - logger.log:
                level: INFO
                format: "Waiting for BLE connection to heat pump..."
            - wait_until:
                condition:
                  lambda: 'return id(ble_connected);'
                timeout: 30s

            # Phase 5: Wait for the on_connect handler to finish reconciling.
            # It polls the heat pump, then syncs mode/target/power. Each sync
            # verifies the write landed and retries on failure, so the total
            # duration varies — we wait for the explicit reconcile_done signal
            # rather than a fixed delay. This both gives retries time to run
            # and lets us sleep promptly once done (saving battery): wait_until
            # returns the instant reconcile_done is set, so the generous
            # timeout costs nothing in the normal case — it's only a safety net
            # to guarantee we reach deep sleep if BLE drops mid-reconcile.
            - wait_until:
                condition:
                  lambda: 'return id(reconcile_done);'
                timeout: 90s

            # ── Phase 5b: Self-heal bookkeeping ─────────────────────────────
            # A wake "succeeded" only if BLE connected AND the reconcile ran to
            # completion. Reset the failure counter on success, otherwise count
            # it. This is what lets the device notice it has become useless
            # (e.g. heat pump BLE unreachable) instead of silently sleep-looping.
            # (A successful reconcile also resets the counter in the ble_client
            # on_connect, covering the awake/recovery path where this does not run.)
            - if:
                condition:
                  lambda: 'return id(ble_connected) && id(reconcile_done);'
                then:
                  - lambda: 'id(consecutive_failures) = 0;'
                else:
                  - lambda: 'if (id(consecutive_failures) < 1000) id(consecutive_failures) += 1;'
                  - logger.log:
                      level: WARN
                      format: "Wake cycle incomplete (BLE/reconcile) — consecutive failures now %d"
                      args: ['id(consecutive_failures)']
            - component.update: consecutive_wake_failures

            # ── Phase 5c: Recovery mode — stay awake if too many failures ───
            # After ${safe_mode_failure_threshold} consecutive failed wakes,
            # stop sleeping and stay awake so the device is reachable for OTA /
            # diagnosis over-the-air instead of disappearing into deep sleep.
            # The 30s interval poll keeps retrying the heat pump; recovery mode
            # latches until the next reset / power-cycle or a Prevent Deep Sleep
            # toggle (a successful reconcile clears the counter but does not, on
            # its own, resume sleeping this session).
            - if:
                condition:
                  lambda: 'return id(consecutive_failures) >= ${safe_mode_failure_threshold};'
                then:
                  - lambda: 'id(recovery_mode) = true;'
                  - deep_sleep.prevent: deep_sleep_1
                  - logger.log:
                      level: WARN
                      format: "Recovery mode: %d consecutive failed wakes — staying awake for OTA/diagnosis"
                      args: ['id(consecutive_failures)']
                  # Persist the counter now (we won't reach the pre-sleep sync).
                  - lambda: 'global_preferences->sync();'
                else:
                  # Phase 6: Refresh battery reading before sleep, pushed to HA
                  # just before we drop the WiFi link. (last_connected is stamped
                  # earlier, on time-sync — see the time: component — so it's not
                  # refreshed here; doing so would only re-stamp it ~13s later and
                  # double the logbook entries per wake.)
                  - component.update: battery_voltage
                  # Refresh the optional external water temperature probe too —
                  # same reasoning as battery_voltage: its update_interval alone
                  # isn't reliably reached within a short wake.
                  - component.update: pool_water_temp

                  # Phase 7: Final settle time so HA receives everything.
                  - delay: 3s

                  # Phase 8: Enter deep sleep until the next wake cycle. Duration
                  # is chosen by enter_deep_sleep_scheduled based on time of day.
                  - script.execute: enter_deep_sleep_scheduled

esp32:
  board: ${esp_board}
  variant: ${esp_variant}
  framework:
    type: esp-idf
    version: recommended

# ─── Logging ────────────────────────────────────────────────────────────────
# The PHNIX protocol codec (CRC, Modbus frame builders, notification decoder)
# lives in a small, host-unit-tested C++ library shipped as an ESPHome external
# component. It is fetched from GitHub at compile time — no local files needed.
# Pin the ref with the `phnix_components_ref` substitution (defaults to `main`;
# testers point it at a feature branch).
external_components:
  - source:
      type: git
      url: https://github.com/a-teece/thermotec-mini-heat-pump-home-assistant-integration
      ref: ${phnix_components_ref}
    components: [phnix]
    refresh: 1d

# Library-only component — no configuration. Compiles the codec into the
# firmware and exposes its headers to the lambdas below.
phnix:

logger:
  level: INFO
  baud_rate: 115200
  logs:
    # Silence the noisy "Error reading char at handle 16, status=2" warning
    # that fires once at boot — ble_client tries to read the notify
    # characteristic at startup and the heat pump rejects it (notify-only).
    ble_sensor: ERROR
    # Quieten per-publish state changes on routine sensor updates.
    sensor: WARN

# ─── Home Assistant API ─────────────────────────────────────────────────────
# ─── MQTT (Home Assistant transport) ────────────────────────────────────────
# Home Assistant transport via an MQTT broker (e.g. the Mosquitto add-on).
# Key settings for a battery / deep-sleep device:
#   * reboot_timeout 0s — never reboot just because the broker is briefly
#     unreachable; the device would otherwise reset mid-cycle on a blip.
#   * discovery — auto-creates the HA entities, so no manual helpers/templates.
#   * discovery_retain — HA re-discovers entities after a restart without the
#     (sleeping) device needing to be online to republish.
# Home Assistant retains *control commands* (so a value changed while the device
# sleeps is applied on the next wake) via the per-entity `command_retain: true`
# set on each control switch/number/select — see the Control entities section.
mqtt:
  broker: !secret mqtt_broker
  port: ${mqtt_port}
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discovery_retain: true
  reboot_timeout: 0s
  # Disable the birth/will (availability) messages. By default ESPHome
  # publishes "online"/"offline" to <prefix>/status, and MQTT discovery wires
  # EVERY entity to that availability topic — so each deep sleep makes the
  # broker see the device go away and HA flips the whole device to
  # `unavailable`, even though the last state values are still retained. A
  # battery deep-sleep device is "asleep", not "offline", ~85% of the time, so
  # this made every entity read `unavailable` almost whenever you looked.
  # Empty messages → no availability topic → HA shows the last retained value
  # across sleep. (Liveness is instead visible via Last Connected / Battery /
  # BLE Connection — add an HA automation alerting on a stale Last Connected if
  # you want a dead-bridge alarm.)
  #
  # shutdown_message must be disabled EXPLICITLY too: it is a third, independent
  # message that also defaults to a RETAINED "offline" on <prefix>/status, and
  # disabling birth/will does NOT disable it (see esphome/components/mqtt
  # validate_config). Entering deep sleep is a clean shutdown, so without this
  # line every sleep still published a retained "offline" — and any entity
  # still wired to the availability topic (discovery from a pre-v2.0.1 build)
  # flipped to `unavailable` on the first sleep and stayed there, because with
  # birth disabled nothing ever publishes "online" again.
  birth_message:
  will_message:
  shutdown_message:
  # Track connection state so on_boot can wait for the broker before deciding
  # whether to sleep (the API's api.connected role, now MQTT's).
  on_connect:
    - lambda: 'id(mqtt_connected) = true;'
    # ── Hand-published discovery for Mode + Target Temperature ──────────────
    # Every control needs `"optimistic": true` in its HA discovery payload so
    # the HA GUI adopts a change IMMEDIATELY, even while the device is deep
    # asleep. Without it HA is non-optimistic: it publishes the (retained)
    # command but snaps the control straight back to the stale retained state
    # topic, so a user setting the temperature during sleep can't see what
    # they requested — even though the retained command WILL be applied on the
    # next wake. In optimistic mode HA shows the commanded value at once,
    # restores it across HA restarts, and still corrects from the state topic
    # whenever the awake device publishes.
    # ESPHome's MQTT switch emits `optimistic` from `assumed_state:` (used by
    # the Power / Prevent Deep Sleep switches below), but its number/select
    # components cannot emit it at all — so those two entities set
    # `discovery: false` and equivalent payloads (identical except for the
    # added "optimistic") are published here instead, retained, on every
    # connect (mirroring when ESPHome sends its own discovery).
    # CRITICAL so HA updates the existing entities in place (no duplicates):
    #   * topic must be <prefix>/<type>/<node_name>/<object_id>/config
    #   * unique_id must match ESPHome's legacy generator:
    #     "ESP" + <component type> + <object_id>
    # Keep name/icon/options/min/max/step/unit here in sync with the entity
    # definitions in the Control entities section.
    - mqtt.publish:
        topic: homeassistant/select/${device_name}/mode/config
        retain: true
        # QoS 1: this is a brief-connection deep-sleep device, and unlike
        # ESPHome's own native discovery (used by every other entity), HA has
        # no earlier retained copy of this hand-rolled config to fall back on
        # for a first-ever flash — a single dropped QoS 0 publish means the
        # entity never appears. QoS 1 makes the broker ack it.
        qos: 1
        payload: !lambda |-
          return std::string(
            R"({"name":"Mode","icon":"mdi:thermostat","options":["Heat","Cool","Auto"],)"
            R"("state_topic":"${device_name}/select/mode/state",)"
            R"("command_topic":"${device_name}/select/mode/command",)"
            R"("retain":true,"optimistic":true,"unique_id":"ESPselectmode",)"
            R"("device":{"identifiers":[")") + get_mac_address() +
            R"("],"name":"${friendly_name}"}})";
    - mqtt.publish:
        topic: homeassistant/number/${device_name}/target_temperature/config
        retain: true
        # QoS 1 — see the Mode select's discovery publish above for why.
        qos: 1
        payload: !lambda |-
          return std::string(
            R"({"name":"Target Temperature","icon":"mdi:thermometer",)"
            R"("device_class":"temperature","unit_of_measurement":"°C",)"
            R"("min":15,"max":40,"step":0.5,)"
            R"("state_topic":"${device_name}/number/target_temperature/state",)"
            R"("command_topic":"${device_name}/number/target_temperature/command",)"
            R"("retain":true,"optimistic":true,"unique_id":"ESPnumbertarget_temperature",)"
            R"("device":{"identifiers":[")") + get_mac_address() +
            R"("],"name":"${friendly_name}"}})";
  on_disconnect:
    - lambda: 'id(mqtt_connected) = false;'
  # Flag the moment the broker (re)delivers the retained Prevent Deep Sleep
  # command on a wake, so on_boot can wait for it deterministically before the
  # sleep decision (fixes the boot-time race where a "stay awake" set during
  # sleep was ignored because the fixed settle delay elapsed before the
  # retained command landed). command_retain guarantees the command exists.
  on_message:
    - topic: ${device_name}/switch/prevent_deep_sleep/command
      then:
        - lambda: 'id(prevent_cmd_received) = true;'

ota:
  - platform: esphome
    password: !secret ota_password

# ─── WiFi (with captive portal fallback) ────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Disable WiFi modem power-save. The ESP32 default is LIGHT (modem sleeps
  # between DTIM beacons), which delays MQTT keepalive/TCP packets and — with
  # BLE sharing the radio on the single-core C6 — causes the broker connection
  # to drop and re-establish (the "mqtt cleared Warning flag" cycle), so
  # commands changed in HA only land when it reconnects. NONE keeps MQTT solid.
  # Negligible battery cost: in deep-sleep mode the device is only awake briefly
  # each cycle; the real saving is the sleep itself.
  power_save_mode: none
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_name}
    password: !secret ap_fallback_password

captive_portal:

# ─── Time ───────────────────────────────────────────────────────────────────
# SNTP (NTP) — no API dependency. Required for the last_connected text sensor
# and the day/night sleep schedule. id kept as ha_time (referenced elsewhere).
time:
  - platform: sntp
    id: ha_time
    on_time_sync:
      then:
        # Stamp the Last Connected heartbeat as soon as the clock is set.
        # Fires shortly after NTP sync on every boot/reconnect, in BOTH sleep
        # and prevent-deep-sleep mode. Without it, the awake (prevent-sleep)
        # branch of on_boot never publishes last_connected at all — leaving it
        # stuck at 'unknown' the whole debug session.
        #
        # We write the formatted timestamp into the retained global (not just
        # the sensor) so Phase 0 of on_boot can republish it on the next wake
        # before the API connects. component.update then re-reads the global
        # and publishes it now.
        - lambda: |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return;
            snprintf(id(last_connected_str), sizeof(id(last_connected_str)),
                     "%04d-%02d-%02d %02d:%02d:%02d",
                     now.year, now.month, now.day_of_month,
                     now.hour, now.minute, now.second);
        - component.update: last_connected

# ─── Deep Sleep ─────────────────────────────────────────────────────────────
# No run_duration set — sleep is entered explicitly from on_boot once the
# wake cycle's work is complete. This avoids ever sleeping mid-BLE-write.
deep_sleep:
  id: deep_sleep_1
  sleep_duration: ${deep_sleep_duration_night}   # safety fallback; runtime uses enter_deep_sleep_scheduled

# ─── BLE ────────────────────────────────────────────────────────────────────
# Aggressive scan duty cycle (window == interval). We're awake briefly
# each cycle so fast connection matters more than scan-time power savings.
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

ble_client:
  - mac_address: !secret pool_heatpump_proxy_device_mac_address
    id: heatpump_ble
    auto_connect: true
    on_connect:
      then:
        - logger.log: "Heat pump connected"
        - lambda: |-
            id(ble_connected) = true;
            // Cleared until the reconcile below completes, so on_boot knows
            // exactly when it's safe to sleep instead of guessing a delay.
            id(reconcile_done) = false;
        # Wait briefly for service discovery to complete, then poll.
        - delay: 3s
        # Poll the heat pump to populate current_target_temp, current_power_state, etc.
        - script.execute: poll_heat_pump
        # Wait for the 4 fragmented notifications to populate
        # current_target_temp and the heat pump temperatures.
        - delay: 5s
        
        # ── Reconcile HA helpers ──
        # Runs on every BLE (re)connect, so handles:
        #   - First connection on each wake from deep sleep
        #   - Reconnects after a brief BLE drop while awake
        #   - Catching up if the helper changed while BLE was down


        # Each setting is reconciled by its own verify-and-retry script
        # (write → re-poll → re-check → retry, capped). A single BLE write is
        # occasionally dropped, and in a sleep cycle the device would sleep
        # before noticing — leaving the helper and heat pump out of sync until
        # a later wake. The sync_* scripts close that gap.
        #
        # script.wait serialises them so each one's write+poll completes before
        # the next begins — no back-to-back writes colliding. Mode is synced
        # FIRST so that the target then lands in the (now correct) active
        # mode's register, carrying the setpoint across a mode change.

        # ── Reconcile all settings (serialised — see sync_all_settings) ──
        - script.execute: sync_all_settings
        - script.wait: sync_all_settings

        # Reconcile finished — on_boot may now proceed to deep sleep. A
        # completed reconcile is the definition of a successful wake, so clear
        # the self-heal failure counter here too (covers the awake/recovery
        # path, where on_boot's Phase 5b bookkeeping does not run again).
        - lambda: |-
            id(reconcile_done) = true;
            id(consecutive_failures) = 0;
        - component.update: consecutive_wake_failures

    on_disconnect:
      then:
        - logger.log: "Heat pump disconnected"
        - lambda: 'id(ble_connected) = false;'

# ─── 1-Wire (optional external water temperature probe) ────────────────────
# Independent of the heat pump's BLE link — just a bus for an optional
# DS18B20 probe on ${water_temp_sensor_pin}. See the substitutions block for
# details. Harmless if nothing is wired: the bus simply finds no devices.
one_wire:
  - platform: gpio
    pin: ${water_temp_sensor_pin}
    id: water_temp_bus

# ─── Control entities (Home Assistant–native, auto-published via MQTT) ───────
# These replace the old input_* helpers + `platform: homeassistant` mirrors:
# the device now owns its Power switch, Mode select, Target number and a
# Prevent Deep Sleep switch, exposed to HA through MQTT discovery.
#   * command_retain — HA retains the command, so a change made while the device
#     sleeps is delivered on its next connect (replaces the helper as the
#     desired-state store across sleep).
#   * optimistic + restore — the entity adopts the commanded value immediately
#     and restores its last value from flash on boot (fallback before MQTT
#     redelivers the retained command).
#   * HA-side optimistic discovery — every control's discovery payload also
#     carries `"optimistic": true` (switches natively via `assumed_state:`,
#     number/select via the hand-published discovery in mqtt: on_connect), so
#     the HA GUI reflects a change immediately even while the device sleeps,
#     instead of snapping back to the stale retained state topic until the
#     next wake. The state topic still corrects the GUI whenever the awake
#     device publishes.
# The verified sync_* scripts are unchanged — the ids match the old mirrors.
switch:
  - platform: template
    name: "Power"
    id: desired_power_state
    icon: "mdi:power"
    optimistic: true
    # assumed_state makes ESPHome add "optimistic":true to the MQTT discovery,
    # so HA applies a toggle to the GUI immediately even while the device is
    # asleep (it would otherwise snap back to the stale retained state topic
    # until the next wake). HA renders the switch as two press-buttons instead
    # of a slide toggle — the honest UI for a mostly-sleeping device.
    assumed_state: true
    restore_mode: RESTORE_DEFAULT_OFF
    command_retain: true
    turn_on_action:
      - if:
          condition:
            lambda: 'return id(ble_connected);'
          then:
            # The optimistic switch fires this action BEFORE it commits the new
            # .state (write_state triggers, then publishes), so sync_power_state
            # would read the stale pre-toggle value and write the wrong power.
            # A brief delay lets the new state land first. (Number/select are
            # Call-based and commit before their action, so they don't need it.)
            - delay: 250ms
            - logger.log:
                level: INFO
                format: "Power set ON — syncing to heat pump"
            - script.execute: sync_all_settings
    turn_off_action:
      - if:
          condition:
            lambda: 'return id(ble_connected);'
          then:
            - delay: 250ms   # see turn_on_action: let .state commit before sync
            - logger.log:
                level: INFO
                format: "Power set OFF — syncing to heat pump"
            - script.execute: sync_all_settings

  - platform: template
    name: "Prevent Deep Sleep"
    id: prevent_deep_sleep_switch
    icon: "mdi:sleep-off"
    entity_category: config
    optimistic: true
    # HA-optimistic discovery — see the Power switch. Especially important
    # here: turning this on while the device sleeps must visibly "stick" in
    # the GUI, since it's the documented no-serial recovery path.
    assumed_state: true
    restore_mode: RESTORE_DEFAULT_OFF
    command_retain: true
    turn_on_action:
      - logger.log:
          level: INFO
          format: "Prevent deep sleep enabled — staying awake"
      - deep_sleep.prevent: deep_sleep_1
    turn_off_action:
      # Enter sleep only when (a) deep sleep is enabled at build time — in
      # always-on builds (enable_deep_sleep: "false") turning this off does
      # nothing — AND (b) the device is genuinely awake (staying_awake).
      # The staying_awake guard is critical: without it, this switch restoring
      # to OFF during setup() on a normal boot fires turn_off_action and
      # short-circuits straight into deep sleep ~5 s in, before WiFi/SNTP/BLE
      # are up — so the device slept with no time sync (night-duration fallback,
      # even in the daytime) and without polling the heat pump. Gated, a boot
      # restore is a no-op and on_boot owns the sleep instead (poll → time
      # sync → correct day/night duration); only a real awake→off toggle sleeps.
      - if:
          condition:
            lambda: 'return ${enable_deep_sleep} && id(staying_awake);'
          then:
            - logger.log:
                level: INFO
                format: "Prevent deep sleep disabled — sleeping shortly"
            - component.update: battery_voltage
            - component.update: pool_water_temp
            - component.update: last_connected
            - delay: 5s
            - script.execute: enter_deep_sleep_scheduled

select:
  - platform: template
    name: "Mode"
    id: desired_mode
    icon: "mdi:thermostat"
    optimistic: true
    restore_value: true
    command_retain: true
    # Discovery is hand-published from mqtt: on_connect with "optimistic":true
    # added (ESPHome's MQTT select cannot emit it) — keep the name/icon/options
    # there in sync with this entity.
    discovery: false
    options: ["Heat", "Cool", "Auto"]
    initial_option: "Heat"
    set_action:
      - if:
          condition:
            lambda: 'return id(ble_connected);'
          then:
            - logger.log:
                level: INFO
                format: "Mode set to %s — syncing to heat pump"
                args: ['id(desired_mode).current_option().c_str()']
            # Serialised apply (power → mode → target); mode-before-target
            # carries the setpoint into the now-current mode's register.
            - script.execute: sync_all_settings

number:
  - platform: template
    name: "Target Temperature"
    id: desired_target_temp
    icon: "mdi:thermometer"
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 15
    max_value: 40
    step: 0.5
    mode: auto
    optimistic: true
    restore_value: true
    command_retain: true
    # Discovery is hand-published from mqtt: on_connect with "optimistic":true
    # added (ESPHome's MQTT number cannot emit it) — keep the name/icon/min/
    # max/step/unit there in sync with this entity.
    discovery: false
    set_action:
      - if:
          condition:
            lambda: 'return id(ble_connected);'
          then:
            - logger.log:
                level: INFO
                format: "Target set to %.1f — syncing to heat pump"
                args: ['id(desired_target_temp).state']
            - script.execute: sync_all_settings

# ─── Binary Sensors ─────────────────────────────────────────────────────────
binary_sensor:
  # ─── Current Power State (read from BLE notify) ──────────────────────────
  # Reflects the heat pump's actual power state as reported via BLE. May briefly
  # differ from desired_power_state while a sync is in flight, or
  # persistently if someone uses the heat pump's physical control panel
  # (HA helper takes priority on the next sync).
  - platform: template
    id: current_power_state
    name: "Power State"
    icon: "mdi:power"
    device_class: power

  # ── BLE link status ───────────────────────────────────────────────────────
  - platform: template
    id: ble_status
    name: "Heat Pump BLE Connection"
    device_class: connectivity
    lambda: 'return id(ble_connected);'

  # ── Recovery mode (self-heal) ─────────────────────────────────────────────
  # ON when the device has hit ${safe_mode_failure_threshold} consecutive
  # failed wakes and is staying awake for OTA/diagnosis instead of sleeping.
  # Latches until the next reset / power-cycle. Worth a Home Assistant alert.
  - platform: template
    id: recovery_mode_status
    name: "Recovery Mode"
    icon: "mdi:lifebuoy"
    device_class: problem
    entity_category: diagnostic
    lambda: 'return id(recovery_mode);'

  # ─── Diagnostic outputs ───────────────────────────────────────────────────
  # output_compressor, output_circulate_pump, output_high_fan and output_4way_valve are 
  # decoded from the bitmask at register 0x07E3 in the notify response.
  - platform: template
    id: output_compressor
    name: "Compressor"
    icon: "mdi:engine"
    device_class: running
    entity_category: diagnostic
    filters:
      - delayed_on_off: 1s    # debounce: only publish if state holds for 1 second to remove the duplicate BLE responses

  - platform: template
    id: output_circulate_pump
    name: "Circulate Pump"
    icon: "mdi:pump"
    device_class: running
    entity_category: diagnostic
    filters:
      - delayed_on_off: 1s    # debounce: only publish if state holds for 1 second to remove the duplicate BLE responses

  - platform: template
    id: output_high_fan
    name: "High Fan"
    icon: "mdi:fan"
    device_class: running
    entity_category: diagnostic
    filters:
      - delayed_on_off: 1s    # debounce: only publish if state holds for 1 second to remove the duplicate BLE responses

  - platform: template
    id: output_4way_valve
    name: "4-Way Valve"
    icon: "mdi:valve"
    device_class: opening
    entity_category: diagnostic
    filters:
      - delayed_on_off: 1s    # debounce: only publish if state holds for 1 second to remove the duplicate BLE responses

  - platform: template
    id: has_error
    name: "Has Error"
    icon: "mdi:alert"
    device_class: problem
    entity_category: diagnostic

  # ─── Temperature sensor fault indicators (P-codes) ─────────────────────────
  # Triggered when temperature register reads heat-pump's "sensor failure"
  # sentinel value. Matches heat-pump's displayed P-codes:
  #   P01=Inlet (T02), P02=Outlet (T03), P04=Ambient (T05),
  #   P05=Coil (T04),  P81=Exhaust (T06)
  - platform: template
    id: inlet_temp_fault
    name: "Inlet Temp Sensor Fault (P01)"
    device_class: problem
    entity_category: diagnostic
    on_state:
      then:
        - component.update: error_description
        - lambda: |-
            bool err = (id(error_code).has_state() && id(error_code).state != 0) ||
                       id(inlet_temp_fault).state ||
                       id(outlet_temp_fault).state ||
                       id(ambient_temp_fault).state ||
                       id(coil_temp_fault).state ||
                       id(exhaust_temp_fault).state;
            id(has_error).publish_state(err);

  - platform: template
    id: outlet_temp_fault
    name: "Outlet Temp Sensor Fault (P02)"
    device_class: problem
    entity_category: diagnostic
    on_state:
      then:
        - component.update: error_description
        - lambda: |-
            bool err = (id(error_code).has_state() && id(error_code).state != 0) ||
                       id(inlet_temp_fault).state ||
                       id(outlet_temp_fault).state ||
                       id(ambient_temp_fault).state ||
                       id(coil_temp_fault).state ||
                       id(exhaust_temp_fault).state;
            id(has_error).publish_state(err);

  - platform: template
    id: ambient_temp_fault
    name: "Ambient Temp Sensor Fault (P04)"
    device_class: problem
    entity_category: diagnostic
    on_state:
      then:
        - component.update: error_description
        - lambda: |-
            bool err = (id(error_code).has_state() && id(error_code).state != 0) ||
                       id(inlet_temp_fault).state ||
                       id(outlet_temp_fault).state ||
                       id(ambient_temp_fault).state ||
                       id(coil_temp_fault).state ||
                       id(exhaust_temp_fault).state;
            id(has_error).publish_state(err);

  - platform: template
    id: coil_temp_fault
    name: "Coil Temp Sensor Fault (P05)"
    device_class: problem
    entity_category: diagnostic
    on_state:
      then:
        - component.update: error_description
        - lambda: |-
            bool err = (id(error_code).has_state() && id(error_code).state != 0) ||
                       id(inlet_temp_fault).state ||
                       id(outlet_temp_fault).state ||
                       id(ambient_temp_fault).state ||
                       id(coil_temp_fault).state ||
                       id(exhaust_temp_fault).state;
            id(has_error).publish_state(err);

  - platform: template
    id: exhaust_temp_fault
    name: "Exhaust Temp Sensor Fault (P81)"
    device_class: problem
    entity_category: diagnostic
    on_state:
      then:
        - component.update: error_description
        - lambda: |-
            bool err = (id(error_code).has_state() && id(error_code).state != 0) ||
                       id(inlet_temp_fault).state ||
                       id(outlet_temp_fault).state ||
                       id(ambient_temp_fault).state ||
                       id(coil_temp_fault).state ||
                       id(exhaust_temp_fault).state;
            id(has_error).publish_state(err);

  # ─── Unit Running State ───────────────────────────────────────────────────
  # Reflects the heat pump's internal "I'm running" state (register 0x07DB).
  # Differs from the power state (0x03F3):
  #   - power state = user's on/off command
  #   - unit state  = "actually running" (may be 0 even when powered on if
  #                   the heat pump has safety-stopped due to a fault).
  - platform: template
    id: unit_running
    name: "Unit Running"
    icon: "mdi:engine"
    device_class: running
    entity_category: diagnostic

# ─── Sensors ────────────────────────────────────────────────────────────────
sensor:
  # ── Optional external water temperature probe (DS18B20 on 1-Wire) ─────────
  # Distinct from Inlet/Outlet Water Temperature below (which read the heat
  # pump's own plumbing over BLE) — this is for a probe placed directly in
  # the pool/spa water, wired to ${water_temp_sensor_pin}. Optional hardware:
  # with nothing wired this entity just stays unavailable.
  # update_interval matches the 30s poll cadence used while awake; explicit
  # component.update calls (on_boot Phase 6, and the Prevent Deep Sleep
  # switch's turn_off_action) guarantee a fresh reading before a short sleep
  # wake — 30s alone isn't reliably reached within the ~20-30s wake window
  # (same reasoning as Battery Voltage's manual update).
  - platform: dallas_temp
    one_wire_id: water_temp_bus
    index: 0
    name: "Pool Water Temperature"
    id: pool_water_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C

  # ── BLE Notification Parser (internal) ────────────────────────────────────
  # This sensor subscribes to BLE notifications from the heat pump and parses
  # each Modbus reply into the real sensors below. It has no value of its
  # own — returning {} from the lambda means "don't publish".
  #
  # Each notification arrives as a std::vector<uint8_t> in `x`.
  - platform: ble_client
    type: characteristic
    ble_client_id: heatpump_ble
    id: notify_handler
    name: "Heat Pump Raw Notify"
    service_uuid: ${service_uuid}
    characteristic_uuid: ${notify_char_uuid}
    notify: true
    internal: true
    lambda: |-
      // Sanity check
      if (x.size() < 5 || x[0] != 0x63) return {};

      // Write ACK (8-byte Modbus 0x10 response)
      if (x[1] == 0x10 && x.size() == 8) {
        uint16_t ack = (x[2] << 8) | x[3];
        ESP_LOGI("heatpump", "Write ACK for 0x%04X", ack);
        return {};
      }

      // Modbus exception
      if ((x[1] & 0x80) && x.size() >= 5) {
        ESP_LOGW("heatpump", "Modbus exception 0x%02X for func 0x%02X",
                 x[2], x[1] & 0x7F);
        return {};
      }

      // Data block (fragmented read response). Validate the header *and CRC*
      // via the phnix codec, then read registers through the validated view —
      // corrupt or short frames are now dropped rather than mis-parsed.
      phnix::BlockView view = phnix::parse_block(x);
      if (!view.valid) {
        ESP_LOGW("heatpump", "Ignoring invalid/short block frame (%u bytes)",
                 (unsigned) x.size());
        return {};
      }
      uint16_t block = view.block_addr;
      auto rd = [&](size_t i) -> int16_t { return (int16_t) view.reg(i); };

      if (block == 0x07FE) {
        // Sensor failure detection. The heat pump signals different
        // failure values per sensor:
        //   T02 Inlet, T03 Outlet, T04 Coil, T06 Exhaust → 0x7FFD
        //   T05 Ambient                                  → 0xFFF6 (-1.0°C)
        // T01 Suction always reads 0x7FFD on single-system models.
        auto pub_temp = [](esphome::template_::TemplateSensor *temp_sensor,
                           esphome::template_::TemplateBinarySensor *fault_sensor,
                           int16_t raw,
                           bool is_ambient) {
          bool fault;
          if (is_ambient) {
            fault = (raw == (int16_t)0xFFF6) || ((raw & 0xFFF0) == 0x7FF0);
          } else {
            fault = ((raw & 0xFFF0) == 0x7FF0);
          }
          fault_sensor->publish_state(fault);
          if (fault) {
            temp_sensor->publish_state(NAN);
          } else {
            temp_sensor->publish_state(raw / 10.0);
          }
        };

        pub_temp(id(inlet_temp),   id(inlet_temp_fault),   rd(1), false);
        pub_temp(id(outlet_temp),  id(outlet_temp_fault),  rd(2), false);
        pub_temp(id(coil_temp),    id(coil_temp_fault),    rd(3), false);
        pub_temp(id(ambient_temp), id(ambient_temp_fault), rd(4), true);
        pub_temp(id(exhaust_temp), id(exhaust_temp_fault), rd(5), false);
        ESP_LOGI("heatpump", "Temps updated");

      } else if (block == 0x0416) {
        // Each mode has its own target register in this block:
        //   reg 0  (0x0416) = R01 Heating set
        //   reg 5  (0x041B) = R06 Cooling set
        //   reg 22 (0x042C) = R11 Auto set
        // The heat pump's display shows whichever matches the current mode,
        // so we mirror that here.
        std::string mode_str = id(current_mode).has_state()
                               ? id(current_mode).state
                               : std::string("Heat");
        float displayed_target;
        if (mode_str == "Cool")      displayed_target = rd(5)  / 10.0;
        else if (mode_str == "Auto") displayed_target = rd(22) / 10.0;
        else                         displayed_target = rd(0)  / 10.0;
        id(current_target_temp).publish_state(displayed_target);
        ESP_LOGI("heatpump", "Target (%s mode) = %.1f",
                 mode_str.c_str(), displayed_target);

        // Diagnostic sensors — always publish all three set-points
        id(heating_set_temp).publish_state(rd(0) / 10.0);
        id(cooling_set_temp).publish_state(rd(5) / 10.0);
        id(auto_set_temp).publish_state(rd(22) / 10.0);
        id(min_heat_temp).publish_state(rd(3) / 10.0);
        id(max_heat_temp).publish_state(rd(4) / 10.0);
        id(min_cool_temp).publish_state(rd(8) / 10.0);
        id(max_cool_temp).publish_state(rd(9) / 10.0);

        // D06 Defrost type at reg 15 (0x0425): 0=Normal, 1=Eco
        int16_t dt = rd(15);
        id(defrost_type).publish_state(
          dt == 0 ? std::string("Normal") :
          dt == 1 ? std::string("Eco") :
          std::string("Unknown"));

        ESP_LOGI("heatpump", "Heat Pump target = %.1f", rd(0) / 10.0);
      } else if (block == 0x03E9) {
        // Block containing register 0x03F3 at offset 10 = power state
        int16_t power = rd(10);
        bool is_on = (power != 0);
        id(current_power_state).publish_state(is_on);

        // Mode at offset 11 (register 0x03F4)
        // 0 = Cool, 1 = Heat, 2 = Auto
        int16_t mode = rd(11);
        const char *mode_str;
        switch (mode) {
          case 0:  mode_str = "Cool"; break;
          case 1:  mode_str = "Heat"; break;
          case 2:  mode_str = "Auto"; break;
          default: mode_str = "Unknown"; break;
        }
        id(current_mode).publish_state(std::string(mode_str));

        // H06 Mode type at reg 22 (0x03FF): 1=Heat pump, 2=Heat only (4-way valve)
        int16_t mt = rd(22);
        id(heater_mode_type).publish_state(
          mt == 1 ? std::string("Heat pump") :
          mt == 2 ? std::string("Heat only (4-way valve)") :
          std::string("Unknown"));

        // P01 Circulating pump mode at reg 36 (0x040D): 0=Normal, 1=Stop, 2=Interval
        int16_t pm = rd(36);
        id(pump_mode).publish_state(
          pm == 0 ? std::string("Normal") :
          pm == 1 ? std::string("Stop") :
          pm == 2 ? std::string("Interval") :
          std::string("Unknown"));

        ESP_LOGI("heatpump", "Heat Pump power=%s mode=%s", is_on ? "ON" : "OFF", mode_str);

      } else if (block == 0x07D1) {
        // Block containing output states at offset 18 (register 0x07E3).
        // Bitmask:
        //   bit 0 (0x01) = compressor  (confirmed via capture)
        //   bit 1 (0x02) = circulate pump  (inferred from app O01-O04 order)
        //   bit 2 (0x04) = high fan  (confirmed via capture)
        //   bit 3 (0x08) = 4-way valve  (inferred from app O01-O04 order)
        int16_t outputs = rd(18);
        id(output_compressor).publish_state((outputs & 0x01) != 0);
        id(output_circulate_pump).publish_state((outputs & 0x02) != 0);
        id(output_high_fan).publish_state((outputs & 0x04) != 0);
        id(output_4way_valve).publish_state((outputs & 0x08) != 0);

        // Firmware identity (block 0x07D1 reg 16 + reg 17).
        // These are stable across reads — published once per session.
        // reg 16 (0x07E1) = "Master program version number", DIGI5 (×10)
        //                   e.g. raw 12 → "1.2"
        // reg 17 (0x07E2) = "Main control software code", DIGI1 (raw)
        //                   e.g. 494
        uint16_t master_ver_raw = rd(16);
        uint16_t soft_code      = rd(17);

        char ver_buf[16];
        snprintf(ver_buf, sizeof(ver_buf), "%u.%u",
                 master_ver_raw / 10, master_ver_raw % 10);
        std::string ver_str(ver_buf);
        if (!id(master_program_version).has_state() ||
            id(master_program_version).state != ver_str) {
          id(master_program_version).publish_state(ver_str);
        }

        char code_buf[16];
        snprintf(code_buf, sizeof(code_buf), "%u", soft_code);
        std::string code_str(code_buf);
        if (!id(main_control_software_code).has_state() ||
            id(main_control_software_code).state != code_str) {
          id(main_control_software_code).publish_state(code_str);
        }

        // Unit running state at offset 10 (register 0x07DB).
        // 0 = stopped (may indicate self-shutdown), 1 = running.
        id(unit_running).publish_state(rd(10) != 0);

        // Error code at offset 33 (register 0x07F2).
        // 0 = no error; 4 = E03 (water flow) confirmed via BLE capture, but see comment below on
        // error_code and error_description sensor for more details on the raw code and display mapping.
        int16_t err = rd(33);
        id(error_code).publish_state(err);

        ESP_LOGI("heatpump", "Outputs = 0x%04X, Error = 0x%04X", outputs, err);
      }
      return {};

  # ── Temperature sensors (parsed from BLE notifications) ───────────────────
  - platform: template
    id: inlet_temp
    name: "Inlet Water Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C to remove the duplicate BLE responses

  - platform: template
    id: outlet_temp
    name: "Outlet Water Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C to remove the duplicate BLE responses

  - platform: template
    id: coil_temp
    name: "Coil Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C to remove the duplicate BLE responses

  - platform: template
    id: ambient_temp
    name: "Ambient Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C to remove the duplicate BLE responses

  - platform: template
    id: exhaust_temp
    name: "Exhaust Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C to remove the duplicate BLE responses

  # ── Current Heat Pump Target (read-only) ─────────────────────────────────────
  # Reflects what the heat pump itself currently thinks the target is, as
  # reported via BLE. May briefly differ from `desired_target_temp` while
  # a sync is in flight, or persistently if someone changes the target on
  # the heat pump's physical control panel (the HA helper takes priority and
  # will overwrite on the next sync).
  - platform: template
    id: current_target_temp
    name: "Current Target Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C to remove the duplicate BLE responses

  # ─── Heat Pump Error Code (raw value) ─────────────────────────────────────────
  # Reads register 0x07F2 from the heat pump. 0 = no error, non-zero = fault.
  # The display shows error codes like E03 which appear to map to internal
  # values with an off-by-one offset (E03 = value 4) OR a bitmask (E03 = Bit 2 aka 0x04).
  # I haven't fully decoded the mapping yet, but capturing the raw code here allows 
  # for future decoding as more faults are encountered.
  - platform: template
    id: error_code
    name: "Error Code"
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    accuracy_decimals: 0
    # Set from the BLE notify parser, never independently polled
    update_interval: never
    # When the raw code changes, push a translated description and the
    # has-error binary state
    on_value:
      then:
        - component.update: error_description
        - lambda: |-
            bool err = (id(error_code).state != 0) ||
                       id(inlet_temp_fault).state ||
                       id(outlet_temp_fault).state ||
                       id(ambient_temp_fault).state ||
                       id(coil_temp_fault).state ||
                       id(exhaust_temp_fault).state;
            id(has_error).publish_state(err);

  # ─── R-tab setpoint diagnostics ────────────────────────────────────────────
  - platform: template
    id: heating_set_temp
    name: "Heating Set Temp (R01)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - delta: 0.05

  - platform: template
    id: cooling_set_temp
    name: "Cooling Set Temp (R06)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - delta: 0.05

  - platform: template
    id: auto_set_temp
    name: "Auto Set Temp (R11)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - delta: 0.05

  - platform: template
    id: min_heat_temp
    name: "Min Heat Limit (R04)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: template
    id: max_heat_temp
    name: "Max Heat Limit (R05)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: template
    id: min_cool_temp
    name: "Min Cool Limit (R09)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: template
    id: max_cool_temp
    name: "Max Cool Limit (R10)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    entity_category: diagnostic

  # ── Consecutive Wake Failures (self-heal diagnostic) ──────────────────────
  # Consecutive wake cycles that failed to complete a poll + reconcile. 0 =
  # healthy; climbs when the heat pump BLE can't be reached. At
  # ${safe_mode_failure_threshold} the device enters recovery mode (stays awake
  # for OTA). Good to alert on in HA alongside a stale Last Connected.
  - platform: template
    name: "Consecutive Wake Failures"
    id: consecutive_wake_failures
    icon: "mdi:alert-decagram-outline"
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never
    lambda: 'return id(consecutive_failures);'

  # ── Battery Voltage ───────────────────────────────────────────────────────
  # The Firebeetle 2 ESP32-C6 has an onboard 1:1 voltage divider on GPIO0.
  # 12dB attenuation gives the ADC a ~3.1V max range; the multiply filter
  # restores the actual cell voltage (LiPo 3.0–4.2V). The pin and multiplier
  # are substitutions (battery_adc_pin / battery_voltage_multiplier) so this
  # works on other boards — see the substitutions block at the top.
  - platform: adc
    pin: ${battery_adc_pin}
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 5min
    attenuation: 12db
    filters:
      - multiply: ${battery_voltage_multiplier}
      # Smooth ADC noise across 3 readings, publish every time so the
      # brief wake window always gets a value out before sleep.
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    on_value:
      then:
        # Refresh derived battery percentage whenever voltage updates.
        # Prevents a race where battery_level evaluates before
        # battery_voltage has a valid reading.
        - component.update: battery_level

  # ── Battery Percentage (derived from voltage) ─────────────────────────────
  # Simple linear curve between the battery_voltage_empty / battery_voltage_full
  # substitutions (default 3.0V = 0%, 4.2V = 100%). Good enough as a rough
  # state-of-charge indicator. For better accuracy, replace with a
  # piecewise discharge curve specific to your cell chemistry.
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    # Never poll independently — only updated via on_value above.
    update_interval: never
    lambda: |-
      float v = id(battery_voltage).state;
      if (isnan(v)) return {};
      float empty = ${battery_voltage_empty};
      float full = ${battery_voltage_full};
      float pct = (v - empty) / (full - empty) * 100.0f;
      return clamp(pct, 0.0f, 100.0f);

# ─── Text Sensors ───────────────────────────────────────────────────────────
text_sensor:
  # Wall-clock time the device last came online and synced with HA. Acts as a
  # heartbeat: if this value stops updating, the device isn't waking properly.
  # update_interval is 'never' — it's published explicitly: from on_time_sync
  # (fresh stamp each wake, both sleep modes) and from on_boot Phase 0 (the
  # retained value, republished before the API connects so HA never sees
  # 'unknown'). The value itself lives in the retained last_connected_str
  # global; this lambda just surfaces it.
  - platform: template
    name: "Last Connected"
    id: last_connected
    icon: "mdi:clock-outline"
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      // Nothing stored yet (first-ever boot) — stay unknown rather than
      // publish an empty string.
      if (id(last_connected_str)[0] == '\0') return {};
      return std::string(id(last_connected_str));

  # ─── Bridge Firmware Version ──────────────────────────────────────────────
  # The version of THIS firmware package (the firmware_version substitution,
  # bumped each release) — answers "what is the device actually running?",
  # which the remote-package build flow otherwise hides. Not the heat pump's
  # own controller firmware; that's Master Program Version. Published once per
  # wake from on_boot Phase 0.
  - platform: template
    name: "Bridge Firmware Version"
    id: bridge_firmware_version
    icon: "mdi:tag-check-outline"
    entity_category: diagnostic
    update_interval: never
    lambda: 'return std::string("${firmware_version}");'

  # ─── Current Mode (read from BLE notify) ─────────────────────────────────
  # Reflects the heat pump's actual mode as reported via BLE. Updated by the
  # notify parser when block 0x03E9 arrives — register 0x03F4 at offset 11.
  - platform: template
    id: current_mode
    name: "Current Mode"
    icon: "mdi:thermostat"

  # ─── Heat Pump Error Description ─────────────────────────────────────────────
  # Translates the raw error code into the display code (E0n) and a
  # description. Add new mappings here as you observe other faults.
  #
  # Confirmed mappings (from BLE capture analysis):
  #   value 0 → No error
  #   value 4 → E03: Water Flow (heat pump shows "E03" on its display)
  #
  # Other codes may be added once observed.
  - platform: template
    name: "Error Description"
    id: error_description
    icon: "mdi:alert-circle-outline"
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      // ── Aggregate all active faults: E-codes from error register +
      //    P-codes from temperature sensor failures ──
      std::string result;
      auto append = [&](const std::string &s) {
        if (!result.empty()) result += "; ";
        result += s;
      };

      // E-codes from error register (bitmask at 0x07F2), decoded by the codec.
      if (id(error_code).has_state()) {
        std::string e = phnix::error_text((uint16_t)(int) id(error_code).state);
        if (!e.empty()) append(e);
      }

      // P-codes from temperature sensor failures
      if (id(inlet_temp_fault).state)   append("P01 Inlet sensor");
      if (id(outlet_temp_fault).state)  append("P02 Outlet sensor");
      if (id(ambient_temp_fault).state) append("P04 Ambient sensor");
      if (id(coil_temp_fault).state)    append("P05 Coil sensor");
      if (id(exhaust_temp_fault).state) append("P81 Exhaust sensor");

      return result.empty() ? std::string("OK") : result;

  # ─── Advanced settings (read-only diagnostics) ────────────────────────────
  # Although it is understood how to set these, it may be dangerous to set them
  # incorrectly so they're implemented as read-only diagnostics for now.
  # Change them using the AquaTemp app and the password "66" for the
  # device parameters menu.
  - platform: template
    id: defrost_type
    name: "Defrost Type"
    icon: "mdi:snowflake-melt"
    entity_category: diagnostic

  - platform: template
    id: heater_mode_type
    name: "Heat Pump Mode Type"
    icon: "mdi:cog"
    entity_category: diagnostic

  - platform: template
    id: pump_mode
    name: "Circulating Pump Mode"
    icon: "mdi:pump"
    entity_category: diagnostic

  # ─── Master Program Version (register 0x07E1) ─────────────────────────────
  # Displayed on the heat pump's control panel as "Master program version
  # number". A DIGI5 value (scaled ×10), so raw 12 = "1.2".
  - platform: template
    name: "Master Program Version"
    id: master_program_version
    icon: "mdi:chip"
    entity_category: diagnostic

  # ─── Main Control Software Code (register 0x07E2) ─────────────────────────
  # Displayed on the heat pump's control panel as "Main control software
  # code". A DIGI1 value (raw integer build code), e.g. 494.
  - platform: template
    name: "Main Control Software Code"
    id: main_control_software_code
    icon: "mdi:chip"
    entity_category: diagnostic

# ─── Scripts ────────────────────────────────────────────────────────────────
script:
  # Apply all desired settings to the heat pump, SERIALISED so that no two BLE
  # writes ever overlap. The heat pump's single GATT link can't take
  # back-to-back/concurrent writes — the colliding one is dropped (un-ACK'd) —
  # so both the on_connect reconcile AND every immediate control change
  # (Power / Mode / Target) must funnel through this one sequence rather than
  # firing their own sync_* concurrently. mode: restart coalesces rapid changes
  # (e.g. dragging the target slider) to just the latest values.
  #
  # Order: POWER first, then MODE, then TARGET.
  #   * Power first so the unit is on (and accepting writes) before we change
  #     mode/setpoint — some units reject those while off, which would
  #     otherwise silently fail until the next reconcile. When power isn't
  #     changing this is an instant no-op, so it only adds time on a real
  #     power-on — exactly when you'd want to wait for "on" anyway.
  #   * Mode before target because the target's register is mode-dependent, so
  #     the setpoint must land in the now-current mode's register.
  - id: sync_all_settings
    mode: restart
    then:
      - script.execute: sync_power_state
      - script.wait: sync_power_state
      - script.execute: sync_mode
      - script.wait: sync_mode
      - script.execute: sync_target_temp
      - script.wait: sync_target_temp

  # Send the Modbus "read all status" command to the heat pump.
  # The heat pump replies with 4 fragmented notifications covering blocks
  # 0x03E9, 0x0416, 0x07D1, 0x07FE — the BLE notify parser above picks
  # them apart and publishes to the real sensors.
  - id: poll_heat_pump
    then:
      - ble_client.ble_write:
          id: heatpump_ble
          service_uuid: ${service_uuid}
          characteristic_uuid: ${write_char_uuid}
          value: !lambda 'return phnix::build_read_all();'

  # Write a new target temperature to the register appropriate to the
  # current operating mode:
  #   Heat → 0x0416 (R01 Heating set)
  #   Cool → 0x041B (R06 Cooling set)
  #   Auto → 0x042C (R11 Auto set)
  #
  # If the current mode isn't known yet (e.g. first connect after wake
  # before the heat pump has been polled), default to heat target — that's
  # the most common case and matches the previous behaviour.
  - id: write_target_temp
    parameters:
      temp_x10: int
    then:
      - ble_client.ble_write:
          id: heatpump_ble
          service_uuid: ${service_uuid}
          characteristic_uuid: ${write_char_uuid}
          value: !lambda |-
            // Route to the register for the current mode (default Heat before
            // the first poll). The codec selects the register; the firmware
            // still owns range-clamping since the limits come from the device.
            std::string mode_str = id(current_mode).has_state()
                                   ? id(current_mode).state
                                   : std::string("Heat");
            phnix::Mode m = (mode_str == "Cool") ? phnix::Mode::Cool
                          : (mode_str == "Auto") ? phnix::Mode::Auto
                                                 : phnix::Mode::Heat;

            // Clamp to the mode-appropriate range
            if (mode_str == "Cool") {
              if (temp_x10 < 100) temp_x10 = 100;   // R09 Min cool = 10°C
              if (temp_x10 > 350) temp_x10 = 350;   // R10 Max cool = 35°C
            } else {
              // Heat & Auto both use heat range
              if (temp_x10 < 150) temp_x10 = 150;   // R04 Min heat = 15°C
              if (temp_x10 > 400) temp_x10 = 400;   // R05 Max heat = 40°C
            }

            ESP_LOGI("heatpump", "Set %s target = %.1f",
                     mode_str.c_str(), temp_x10 / 10.0);
            return phnix::build_set_target(m, temp_x10 / 10.0f);

  # Reconcile the heat pump's target temperature with the desired (HA helper)
  # value, with verification and retry — same pattern as sync_power_state.
  # After each write we re-poll and re-check current_target_temp; if it still
  # differs (beyond the 0.05°C float tolerance) we try again, up to a cap.
  #
  # Note: write_target_temp clamps to the active mode's range, so if the
  # desired value is outside that range the loop will retry to the cap and
  # then warn — the clamped value is the best the heat pump will accept.
  - id: sync_target_temp
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(desired_target_temp).has_state() && id(ble_connected);'
          then:
            - lambda: 'id(target_sync_attempts) = 0;'
            - while:
                condition:
                  lambda: |-
                    if (!id(ble_connected)) return false;
                    if (id(target_sync_attempts) >= 3) return false;
                    // No reading yet — loop so we write and poll to get one.
                    if (!id(current_target_temp).has_state()) return true;
                    // 0.05°C tolerance avoids spurious writes from float
                    // precision (heat pump stores in 0.1°C steps).
                    return fabsf(id(desired_target_temp).state -
                                 id(current_target_temp).state) > 0.05f;
                then:
                  - lambda: 'id(target_sync_attempts) += 1;'
                  - logger.log:
                      level: INFO
                      format: "Syncing target (attempt %d/3): HA=%.1f"
                      args: ['id(target_sync_attempts)',
                             'id(desired_target_temp).state']
                  - script.execute:
                      id: write_target_temp
                      temp_x10: !lambda 'return (int)(id(desired_target_temp).state * 10);'
                  - delay: 2s
                  - script.execute: poll_heat_pump
                  - delay: 3s
            - lambda: |-
                bool synced = id(current_target_temp).has_state() &&
                              fabsf(id(desired_target_temp).state -
                                    id(current_target_temp).state) <= 0.05f;
                if (synced) {
                  ESP_LOGI("heatpump", "Target confirmed: %.1f",
                           id(desired_target_temp).state);
                } else {
                  ESP_LOGW("heatpump",
                           "Target NOT confirmed after %d attempts (HA=%.1f) — "
                           "will retry on next reconcile",
                           id(target_sync_attempts), id(desired_target_temp).state);
                }

  # Write the power on/off state to register 0x03F3.
  # Captured commands:
  #   OFF: 63 10 03 F3 00 01 02 00 00 30 F1
  #   ON:  63 10 03 F3 00 01 02 00 01 F1 31
  - id: write_power_state
    parameters:
      power_on: bool
    then:
      - ble_client.ble_write:
          id: heatpump_ble
          service_uuid: ${service_uuid}
          characteristic_uuid: ${write_char_uuid}
          value: !lambda |-
            ESP_LOGI("heatpump", "Set power = %s", power_on ? "ON" : "OFF");
            return phnix::build_power(power_on);

  # Reconcile the heat pump's power state with the desired (HA helper) state,
  # with verification and retry. A single BLE write to 0x03F3 is occasionally
  # dropped, so after each write we re-poll and re-check current_power_state;
  # if it still disagrees we try again, up to a small cap. This is what makes
  # power toggles reliable in deep-sleep mode, where there's only one brief
  # wake window to get it right.
  #
  # mode: restart — a new toggle while a sync is in flight restarts it cleanly
  # with the latest desired value.
  - id: sync_power_state
    mode: restart
    then:
      - if:
          condition:
            # A switch always has a usable .state (unlike the old HA-helper
            # mirror, switch::has_state() is never set — guarding on it would
            # block every power sync). Just need a live BLE link to poll/write.
            lambda: 'return id(ble_connected);'
          then:
            - lambda: 'id(power_sync_attempts) = 0;'
            - while:
                condition:
                  lambda: |-
                    // Stop if BLE dropped or we've exhausted our retries.
                    if (!id(ble_connected)) return false;
                    if (id(power_sync_attempts) >= 3) return false;
                    // No reading yet — loop so we write and poll to get one.
                    if (!id(current_power_state).has_state()) return true;
                    // Otherwise keep going only while the states disagree.
                    return id(desired_power_state).state != id(current_power_state).state;
                then:
                  - lambda: 'id(power_sync_attempts) += 1;'
                  - logger.log:
                      level: INFO
                      format: "Syncing power (attempt %d/3): HA=%s"
                      args: ['id(power_sync_attempts)',
                             'id(desired_power_state).state ? "ON" : "OFF"']
                  - script.execute:
                      id: write_power_state
                      power_on: !lambda 'return id(desired_power_state).state;'
                  # Let the write apply, then re-poll and wait for the notify
                  # response so current_power_state reflects reality before the
                  # while condition re-evaluates. The heat pump can take ~10-15s
                  # to report a power change back in register 0x03F3, so this
                  # settle is longer than mode/target's — too short and the
                  # confirm check gives up (false "NOT confirmed") before the
                  # pump has reported the change it already accepted (ACK'd).
                  - delay: 2s
                  - script.execute: poll_heat_pump
                  - delay: 6s
            # Report the outcome so the logs make a failure obvious.
            - lambda: |-
                bool synced = id(current_power_state).has_state() &&
                              id(desired_power_state).state == id(current_power_state).state;
                if (synced) {
                  ESP_LOGI("heatpump", "Power state confirmed: %s",
                           id(desired_power_state).state ? "ON" : "OFF");
                } else {
                  ESP_LOGW("heatpump",
                           "Power state NOT confirmed after %d attempts (HA=%s) — "
                           "will retry on next reconcile",
                           id(power_sync_attempts),
                           id(desired_power_state).state ? "ON" : "OFF");
                }

  # Write the operating mode to register 0x03F4 (and 0x03F5).
  # The app writes 2 consecutive registers — we replicate that exactly to
  # match observed behaviour. Register 0x03F5's purpose isn't fully
  # understood but appears mode-dependent.
  #
  # Captured commands (CRCs verified, labels corrected — 0x00 is Cool, 0x01 is Heat):
  #   COOL: 63 10 03 F4 00 02 04 00 00 00 00 1C 51
  #   HEAT: 63 10 03 F4 00 02 04 00 01 00 88 4D F7
  #   AUTO: 63 10 03 F4 00 02 04 00 02 00 8C BC 34
  - id: write_mode
    parameters:
      mode: string
    then:
      - ble_client.ble_write:
          id: heatpump_ble
          service_uuid: ${service_uuid}
          characteristic_uuid: ${write_char_uuid}
          value: !lambda |-
            // The codec writes both registers (0x03F4 mode + 0x03F5 companion)
            // exactly as the app does. Unrecognised strings default to Heat.
            phnix::Mode m = (mode == "Cool") ? phnix::Mode::Cool
                          : (mode == "Auto") ? phnix::Mode::Auto
                                             : phnix::Mode::Heat;
            ESP_LOGI("heatpump", "Set mode = %s", mode.c_str());
            return phnix::build_mode(m);

  # Reconcile the heat pump's operating mode with the desired (HA helper)
  # value, with verification and retry — same pattern as sync_power_state.
  # After each write we re-poll and re-check current_mode; if it still differs
  # we try again, up to a cap. Callers that need the target re-pushed into the
  # new mode's register should run sync_target_temp after this completes.
  - id: sync_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(desired_mode).has_state() && id(ble_connected);'
          then:
            - lambda: 'id(mode_sync_attempts) = 0;'
            - while:
                condition:
                  lambda: |-
                    if (!id(ble_connected)) return false;
                    if (id(mode_sync_attempts) >= 3) return false;
                    // No reading yet — loop so we write and poll to get one.
                    if (!id(current_mode).has_state()) return true;
                    return id(desired_mode).current_option() != id(current_mode).state;
                then:
                  - lambda: 'id(mode_sync_attempts) += 1;'
                  - logger.log:
                      level: INFO
                      format: "Syncing mode (attempt %d/3): HA=%s"
                      args: ['id(mode_sync_attempts)',
                             'id(desired_mode).current_option().c_str()']
                  - script.execute:
                      id: write_mode
                      mode: !lambda 'return id(desired_mode).current_option();'
                  - delay: 2s
                  - script.execute: poll_heat_pump
                  - delay: 3s
            - lambda: |-
                bool synced = id(current_mode).has_state() &&
                              id(desired_mode).current_option() == id(current_mode).state;
                if (synced) {
                  ESP_LOGI("heatpump", "Mode confirmed: %s",
                           id(desired_mode).current_option().c_str());
                } else {
                  ESP_LOGW("heatpump",
                           "Mode NOT confirmed after %d attempts (HA=%s) — "
                           "will retry on next reconcile",
                           id(mode_sync_attempts), id(desired_mode).current_option().c_str());
                }

  # Choose the correct deep sleep duration based on the current time of day,
  # then enter deep sleep. Called from on_boot and from the prevent-deep-sleep
  # on_state handler so the schedule is respected in both cases.
  # Falls back to deep_sleep_duration_night if HA time has not yet synced.
  - id: enter_deep_sleep_scheduled
    then:
      # Force any staged preferences to flash before sleeping. last_connected_str
      # (the heartbeat) and the retained control entities (power/mode/target)
      # stage their values from their own 1 s polls during the wake — well
      # before this point — so there is nothing fresh to wait on here. ESPHome's
      # periodic flush interval is far longer than a wake cycle, so without this
      # explicit sync the values written this wake would not survive the
      # imminent deep sleep. (BLE-derived sensor values are no longer persisted
      # here — MQTT's retained state topics carry them across sleep instead.)
      #
      # Also disarm the double-reset detector: this is a *clean* sleep entry, so
      # the next wake must not mistake it for a reset-button double-press.
      - if:
          condition:
            lambda: 'return ${enable_double_reset_wake};'
          then:
            - lambda: 'id(drd_flag) = false;'
      - lambda: 'global_preferences->sync();'
      - if:
          condition:
            lambda: |-
              auto now = id(ha_time).now();
              return now.is_valid()
                     && now.hour >= ${day_start_hour}
                     && now.hour < ${day_end_hour};
          then:
            - logger.log:
                level: INFO
                format: "Entering deep sleep (day — ${deep_sleep_duration_day})"
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: ${deep_sleep_duration_day}
          else:
            - logger.log:
                level: INFO
                format: "Entering deep sleep (night — ${deep_sleep_duration_night})"
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: ${deep_sleep_duration_night}

# ─── Periodic Polling (only effective while awake) ──────────────────────────
# When prevent_deep_sleep is on, the device stays awake and this interval
# fires every 30s to refresh sensors. During sleep cycles we sleep long
# before 30s elapses, so this never runs — each wake cycle does its own
# single poll from the on_connect handler.
interval:
  - interval: 30s
    then:
      - script.execute: poll_heat_pump