# ─── Globals ────────────────────────────────────────────────────────────────
# ─── Required Secrets ───────────────────────────────────────────────────────
# These secrets are required in your secrets.yaml file which can easily be
# edited in the ESP Home dashboard (top right).
#  wifi_ssid: "your WiFi network name"
#  wifi_password: "your WiFi network key"
#  ap_fallback_password: "a strong password for the fallback WiFi hotspot, e.g. my_secure_fallback_password"
#  ota_password: "a strong password for OTA updates, e.g. my_very_secure_password"
#  pool_heatpump_proxy_api_key: "a random 16-byte hex string for API encryption, e.g. 0123456789abcdef0123456789abcdef"
#  pool_heatpump_proxy_device_mac_address: "your heat pump's BLE MAC address, e.g. AA:BB:CC:DD:EE:FF"

# ─── Globals ────────────────────────────────────────────────────────────────
substitutions:
  device_name: pool-heatpump-proxy
  friendly_name: Pool Heatpump Proxy
  service_uuid: "0000ff01-0000-1000-8000-00805f9b34fb"
  write_char_uuid: "0000ff03-0000-1000-8000-00805f9b34fb"
  notify_char_uuid: "0000ff02-0000-1000-8000-00805f9b34fb"

  # So that we can update values in Home Assistant while this device is asleep,
  # we use some Home Assistant helpers.
  # Create them in HA "Settings → Devices & Services → Helpers → Create".
  # Suggested name/id. If the name changes, update the `entity_id` below to match.

  #  Type: Toggle helper (aka input_boolean)
  #  Name: Pool Heater Prevent Deep Sleep
  #  Entity ID: input_boolean.pool_heater_prevent_deep_sleep
  home_assistant_prevent_deep_sleep_switch_name: input_boolean.pool_heater_prevent_deep_sleep

  #  Type: Toggle helper (aka input_boolean)
  #  Name: Pool Heater Power
  #  Entity ID: input_boolean.pool_heater_power
  home_assistant_desired_power_state_switch_name: input_boolean.pool_heater_power

  #  Type: Number (aka input_number)
  #  Name: Pool Target Temperature
  #  Entity ID: input_number.pool_target_temperature
  #  Minimum: 15
  #  Maximum: 40
  #  Step: 0.5
  #  Unit: °C
  #  Display: Slider
  home_assistant_desired_target_temp_number_name: input_number.pool_target_temperature

  #  Type: Dropdown (aka input_select)
  #  Name: Pool Heater Mode
  #  Entity ID: input_select.pool_heater_mode
  #  Options: Heat, Cool, Auto
  home_assistant_desired_mode_select_name: input_select.pool_heater_mode

  # Sleep duration during "day" hours (between day_start_hour and day_end_hour).
  # Use shorter durations during the hours when you're likely to adjust settings.
  # Valid units: s (seconds), min (minutes), h (hours). E.g. "10min", "1h".
  deep_sleep_duration_day: 5min

  # Sleep duration during "night" hours (outside the day window).
  # Longer duration saves battery overnight when changes are unlikely.
  deep_sleep_duration_night: 15min

  # Start and end of the "day" window in 24-hour whole hours (0–23).
  # day_start_hour: device uses deep_sleep_duration_day from this hour onward.
  # day_end_hour:   device switches back to deep_sleep_duration_night at this hour.
  # Example: "9" and "18" = 09:00–17:59 day mode, 18:00–08:59 night mode.
  # Has no effect if Pool Heater Prevent Deep Sleep is on (USB / always-on mode).
  day_start_hour: "9"
  day_end_hour: "18"

# ─── Globals ────────────────────────────────────────────────────────────────
globals:
  # Tracks whether the BLE link to the heat pump is up.
  # Used by on_boot to wait until connected before sleeping.
  # NOT restored — BLE state from a previous wake cycle is meaningless.
  - id: ble_connected
    type: bool
    initial_value: 'false'
    restore_value: no

  # Counts write attempts within a single sync_* run so each verify-and-retry
  # loop has a bounded number of tries. Reset at the start of each run; not
  # meaningful across wakes.
  - id: power_sync_attempts
    type: int
    initial_value: '0'
    restore_value: no
  - id: target_sync_attempts
    type: int
    initial_value: '0'
    restore_value: no
  - id: mode_sync_attempts
    type: int
    initial_value: '0'
    restore_value: no

  # Set true by on_connect once it has finished reconciling HA helpers with
  # the heat pump (including any power-state retries). on_boot waits on this
  # before sleeping, so the device stays awake exactly as long as the
  # reconcile needs — no longer, no shorter. NOT restored.
  - id: reconcile_done
    type: bool
    initial_value: 'false'
    restore_value: no

  # Last successful HA-sync timestamp ("YYYY-MM-DD HH:MM:SS"), RETAINED across
  # deep sleep so it can be published the instant HA reconnects — before the
  # API hands the entity its first state. Without this, the template sensor
  # has no value on a fresh wake and HA records an 'unknown' every cycle.
  # Stored as a fixed char array (trivially copyable → safely restorable;
  # std::string globals can't be restored). Zero-initialised on first-ever
  # boot, so an empty first byte means "nothing stored yet". Persisted to
  # flash by global_preferences->sync() just before deep sleep.
  - id: last_connected_str
    type: char[24]
    restore_value: yes

  # ── Sensor state snapshot, RETAINED across deep sleep ─────────────────────
  # ESPHome's template sensor/binary_sensor/text_sensor platforms do NOT
  # support restore_value, so the only way to carry a BLE-derived reading
  # across a deep-sleep reboot is to mirror it in a restored global.
  #
  # The whole set is snapshotted in one place — enter_deep_sleep_scheduled,
  # the single chokepoint before every sleep — by reading each sensor's
  # current .state, then flushed to flash by global_preferences->sync().
  # on_boot Phase 0 republishes them synchronously before the API connects,
  # so HA transitions unavailable → last-known-value with no 'unknown' in
  # between (the first BLE poll then updates them ~30 s later, or the
  # delta/delayed_on_off filters suppress it as a no-op if unchanged).
  #
  # snapshot_valid gates the republish: it's false on the first-ever boot
  # (nothing captured yet) and set true the first time we snapshot.
  - id: snapshot_valid
    type: bool
    initial_value: 'false'
    restore_value: yes

  # Floats default to NAN so a sensor that was never populated republishes as
  # 'unavailable' rather than a bogus 0.0.
  - id: g_inlet_temp
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: g_outlet_temp
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: g_coil_temp
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: g_ambient_temp
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: g_exhaust_temp
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: g_target_temp
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: g_heating_set
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: g_cooling_set
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: g_auto_set
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: g_min_heat
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: g_max_heat
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: g_min_cool
    type: float
    initial_value: 'NAN'
    restore_value: yes
  - id: g_max_cool
    type: float
    initial_value: 'NAN'
    restore_value: yes

  - id: g_power
    type: bool
    initial_value: 'false'
    restore_value: yes
  - id: g_unit_running
    type: bool
    initial_value: 'false'
    restore_value: yes
  - id: g_out_compressor
    type: bool
    initial_value: 'false'
    restore_value: yes
  - id: g_out_pump
    type: bool
    initial_value: 'false'
    restore_value: yes
  - id: g_out_fan
    type: bool
    initial_value: 'false'
    restore_value: yes
  - id: g_out_valve
    type: bool
    initial_value: 'false'
    restore_value: yes
  - id: g_f_inlet
    type: bool
    initial_value: 'false'
    restore_value: yes
  - id: g_f_outlet
    type: bool
    initial_value: 'false'
    restore_value: yes
  - id: g_f_ambient
    type: bool
    initial_value: 'false'
    restore_value: yes
  - id: g_f_coil
    type: bool
    initial_value: 'false'
    restore_value: yes
  - id: g_f_exhaust
    type: bool
    initial_value: 'false'
    restore_value: yes

  - id: g_error_code
    type: int
    initial_value: '0'
    restore_value: yes

  # Text-sensor mirrors. char[] (trivially copyable) so they can be restored;
  # std::string globals can't. Sized to the longest value each can hold.
  # Last known operating mode ("Heat", "Cool", "Auto").
  - id: current_mode_str
    type: char[8]
    restore_value: yes
  - id: g_defrost
    type: char[12]
    restore_value: yes
  - id: g_heater_type
    type: char[28]
    restore_value: yes
  - id: g_pump_mode
    type: char[12]
    restore_value: yes
  - id: g_master_ver
    type: char[12]
    restore_value: yes
  - id: g_soft_code
    type: char[12]
    restore_value: yes

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    # Run after WiFi/API are initialized but before deep_sleep enters.
    # Priority -100 places us late in the boot sequence.
    priority: -100.0
    then:
      # ── Phase 0: Republish retained values BEFORE the API connects ────────
      # Runs synchronously at the very start of on_boot — before the
      # wait_until below yields to the loop that services API clients — so
      # values are already set when HA subscribes to states. HA therefore sees
      # the previous values immediately on reconnect and never records an
      # 'unknown'. The first BLE poll a few seconds later overwrites them with
      # fresh data (or the delta/delayed_on_off filters suppress it as a no-op
      # if unchanged). All values come from globals snapshotted before the last
      # sleep (see enter_deep_sleep_scheduled).
      - if:
          condition:
            lambda: 'return id(last_connected_str)[0] != ''\0'';'
          then:
            - component.update: last_connected
      - if:
          condition:
            lambda: 'return id(snapshot_valid);'
          then:
            - lambda: |-
                // Numeric sensors. NAN republishes as 'unavailable' (cleaner
                // than 'unknown'); the delta filter passes the first value.
                id(inlet_temp).publish_state(id(g_inlet_temp));
                id(outlet_temp).publish_state(id(g_outlet_temp));
                id(coil_temp).publish_state(id(g_coil_temp));
                id(ambient_temp).publish_state(id(g_ambient_temp));
                id(exhaust_temp).publish_state(id(g_exhaust_temp));
                id(current_target_temp).publish_state(id(g_target_temp));
                id(heating_set_temp).publish_state(id(g_heating_set));
                id(cooling_set_temp).publish_state(id(g_cooling_set));
                id(auto_set_temp).publish_state(id(g_auto_set));
                id(min_heat_temp).publish_state(id(g_min_heat));
                id(max_heat_temp).publish_state(id(g_max_heat));
                id(min_cool_temp).publish_state(id(g_min_cool));
                id(max_cool_temp).publish_state(id(g_max_cool));

                // Binary sensors.
                id(current_power_state).publish_state(id(g_power));
                id(unit_running).publish_state(id(g_unit_running));
                id(output_compressor).publish_state(id(g_out_compressor));
                id(output_circulate_pump).publish_state(id(g_out_pump));
                id(output_high_fan).publish_state(id(g_out_fan));
                id(output_4way_valve).publish_state(id(g_out_valve));

                // error_code first so the fault sensors' has_error recompute
                // (which reads error_code) sees it; error_code's own on_value
                // also refreshes error_description.
                id(error_code).publish_state(id(g_error_code));
                id(inlet_temp_fault).publish_state(id(g_f_inlet));
                id(outlet_temp_fault).publish_state(id(g_f_outlet));
                id(ambient_temp_fault).publish_state(id(g_f_ambient));
                id(coil_temp_fault).publish_state(id(g_f_coil));
                id(exhaust_temp_fault).publish_state(id(g_f_exhaust));

                // Text sensors — publish only if we have a stored value.
                if (id(current_mode_str)[0]) id(current_mode).publish_state(std::string(id(current_mode_str)));
                if (id(g_defrost)[0])     id(defrost_type).publish_state(std::string(id(g_defrost)));
                if (id(g_heater_type)[0]) id(heater_mode_type).publish_state(std::string(id(g_heater_type)));
                if (id(g_pump_mode)[0])   id(pump_mode).publish_state(std::string(id(g_pump_mode)));
                if (id(g_master_ver)[0])  id(master_program_version).publish_state(std::string(id(g_master_ver)));
                if (id(g_soft_code)[0])   id(main_control_software_code).publish_state(std::string(id(g_soft_code)));

      # ── Phase 1: Wait for the HA API ────────────────────────────────────
      # We need the API to read the prevent-sleep helper and the desired
      # target temp helper. Without it we'd risk sleeping when we shouldn't.
      - wait_until:
          condition:
            api.connected:
          timeout: 15s

      # ── Phase 2: Give HA a moment to push helper states ─────────────────
      # After the API connects, HA sends the current values of mirrored
      # helpers. A short delay ensures they've arrived before we read them.
      - delay: 2s

      # ── Phase 3: Decide between awake mode and a sleep cycle ────────────
      - if:
          condition:
            - binary_sensor.is_on: prevent_deep_sleep_switch
          then:
            # ── AWAKE MODE: stay on for OTA, debugging, or fast feedback ─
            - deep_sleep.prevent: deep_sleep_1
            - logger.log:
                level: INFO
                format: "Deep sleep prevented — OTA/debug mode active"
            # The interval timer below handles continuous 30s polling.
          else:
            # ── SLEEP CYCLE: wake → connect → sync target → sleep ───────

            # Phase 4: Wait for BLE link to the heat pump.
            # auto_connect starts scanning at boot. Connection usually
            # completes in 5-15s depending on RF conditions.
            - logger.log:
                level: INFO
                format: "Waiting for BLE connection to heat pump..."
            - wait_until:
                condition:
                  lambda: 'return id(ble_connected);'
                timeout: 30s

            # Phase 5: Wait for the on_connect handler to finish reconciling.
            # It polls the heat pump, then syncs mode/target/power. Each sync
            # verifies the write landed and retries on failure, so the total
            # duration varies — we wait for the explicit reconcile_done signal
            # rather than a fixed delay. This both gives retries time to run
            # and lets us sleep promptly once done (saving battery): wait_until
            # returns the instant reconcile_done is set, so the generous
            # timeout costs nothing in the normal case — it's only a safety net
            # to guarantee we reach deep sleep if BLE drops mid-reconcile.
            - wait_until:
                condition:
                  lambda: 'return id(reconcile_done);'
                timeout: 90s

            # Phase 6: Refresh battery reading before sleep, pushed to HA just
            # before we drop the WiFi link. (last_connected is stamped earlier,
            # on time-sync — see the time: component — so it's not refreshed
            # here; doing so would only re-stamp it ~13s later and double the
            # logbook entries per wake.)
            - component.update: battery_voltage

            # Phase 7: Final settle time so HA receives everything.
            - delay: 3s

            # Phase 8: Enter deep sleep until the next wake cycle.
            # Duration is chosen by enter_deep_sleep_scheduled based on time of day.
            - script.execute: enter_deep_sleep_scheduled

esp32:
  board: dfrobot_firebeetle2_esp32c6
  variant: ESP32C6
  framework:
    type: esp-idf
    version: recommended

# ─── Logging ────────────────────────────────────────────────────────────────
logger:
  level: INFO
  baud_rate: 115200
  logs:
    # Silence the noisy "Error reading char at handle 16, status=2" warning
    # that fires once at boot — ble_client tries to read the notify
    # characteristic at startup and the heat pump rejects it (notify-only).
    ble_sensor: ERROR
    # Quieten per-publish state changes on routine sensor updates.
    sensor: WARN

# ─── Home Assistant API ─────────────────────────────────────────────────────
api:
  encryption:
    key: !secret pool_heatpump_proxy_api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ─── WiFi (with captive portal fallback) ────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_name}
    password: !secret ap_fallback_password

captive_portal:

# ─── Time ───────────────────────────────────────────────────────────────────
# Sync from HA over the API. Required for the last_connected text sensor
# to display a human-readable wake timestamp.
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        # Stamp the Last Connected heartbeat as soon as HA time is available.
        # This fires shortly after the API connects on every boot/reconnect,
        # in BOTH sleep and prevent-deep-sleep mode. Without it, the awake
        # (prevent-sleep) branch of on_boot never publishes last_connected at
        # all — leaving it stuck at 'unknown' the whole debug session.
        #
        # We write the formatted timestamp into the retained global (not just
        # the sensor) so Phase 0 of on_boot can republish it on the next wake
        # before the API connects. component.update then re-reads the global
        # and publishes it now.
        - lambda: |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return;
            snprintf(id(last_connected_str), sizeof(id(last_connected_str)),
                     "%04d-%02d-%02d %02d:%02d:%02d",
                     now.year, now.month, now.day_of_month,
                     now.hour, now.minute, now.second);
        - component.update: last_connected

# ─── Deep Sleep ─────────────────────────────────────────────────────────────
# No run_duration set — sleep is entered explicitly from on_boot once the
# wake cycle's work is complete. This avoids ever sleeping mid-BLE-write.
deep_sleep:
  id: deep_sleep_1
  sleep_duration: ${deep_sleep_duration_night}   # safety fallback; runtime uses enter_deep_sleep_scheduled

# ─── BLE ────────────────────────────────────────────────────────────────────
# Aggressive scan duty cycle (window == interval). We're awake briefly
# each cycle so fast connection matters more than scan-time power savings.
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

ble_client:
  - mac_address: !secret pool_heatpump_proxy_device_mac_address
    id: heatpump_ble
    auto_connect: true
    on_connect:
      then:
        - logger.log: "Heat pump connected"
        - lambda: |-
            id(ble_connected) = true;
            // Cleared until the reconcile below completes, so on_boot knows
            // exactly when it's safe to sleep instead of guessing a delay.
            id(reconcile_done) = false;
        # Wait briefly for service discovery to complete, then poll.
        - delay: 3s
        # Poll the heat pump to populate current_target_temp, current_power_state, etc.
        - script.execute: poll_heat_pump
        # Wait for the 4 fragmented notifications to populate
        # current_target_temp and the heat pump temperatures.
        - delay: 5s
        
        # ── Reconcile HA helpers ──
        # Runs on every BLE (re)connect, so handles:
        #   - First connection on each wake from deep sleep
        #   - Reconnects after a brief BLE drop while awake
        #   - Catching up if the helper changed while BLE was down


        # Each setting is reconciled by its own verify-and-retry script
        # (write → re-poll → re-check → retry, capped). A single BLE write is
        # occasionally dropped, and in a sleep cycle the device would sleep
        # before noticing — leaving the helper and heat pump out of sync until
        # a later wake. The sync_* scripts close that gap.
        #
        # script.wait serialises them so each one's write+poll completes before
        # the next begins — no back-to-back writes colliding. Mode is synced
        # FIRST so that the target then lands in the (now correct) active
        # mode's register, carrying the setpoint across a mode change.

        # ── Mode ──
        - script.execute: sync_mode
        - script.wait: sync_mode

        # ── Target temp ──
        - script.execute: sync_target_temp
        - script.wait: sync_target_temp

        # ── Power State ──
        - script.execute: sync_power_state
        - script.wait: sync_power_state

        # Reconcile finished — on_boot may now proceed to deep sleep.
        - lambda: 'id(reconcile_done) = true;'

    on_disconnect:
      then:
        - logger.log: "Heat pump disconnected"
        - lambda: 'id(ble_connected) = false;'

# ─── Binary Sensors ─────────────────────────────────────────────────────────
binary_sensor:
  # ── Prevent Deep Sleep helper ─────────────────────────────────────────────
  # Mirrors the HA helper defined by the global home_assistant_prevent_deep_sleep_switch_name.
  # Because the state lives in HA, it can be toggled while the device is asleep and the new 
  # value will be read on the next wake from on_boot.
  - platform: homeassistant
    id: prevent_deep_sleep_switch
    entity_id: ${home_assistant_prevent_deep_sleep_switch_name}
    on_state:
      then:
        - if:
            condition:
              - binary_sensor.is_off: prevent_deep_sleep_switch
            then:
              # Toggle was just turned off while device was awake → sleep.
              - logger.log:
                  level: INFO
                  format: "Prevent deep sleep disabled — sleeping shortly"
              - component.update: battery_voltage
              - component.update: last_connected
              - delay: 5s
              - script.execute: enter_deep_sleep_scheduled
            else:
              # Toggle just turned on while awake → cancel any pending sleep.
              - logger.log:
                  level: INFO
                  format: "Prevent deep sleep enabled — staying awake"
              - deep_sleep.prevent: deep_sleep_1

  # ─── Desired Power State (mirror of HA helper) ───────────────────────────
  # Mirrors the HA helper defined by the global home_assistant_desired_power_state_switch_name.
  # Like the target temp helper, the value lives in HA so it can be changed while the device is 
  # asleep — the new state is read on the next wake and applied via the on_connect handler.
  - platform: homeassistant
    id: desired_power_state
    entity_id: ${home_assistant_desired_power_state_switch_name}
    on_state:
      then:
        # Apply immediately if the heat pump is reachable. sync_power_state
        # writes, re-polls, and retries until the heat pump confirms the new
        # state, so a single dropped BLE write no longer silently fails.
        # If BLE is down, the on_connect handler reconciles on the next wake.
        - if:
            condition:
              lambda: 'return id(ble_connected);'
            then:
              - logger.log:
                  level: INFO
                  format: "Helper changed power to %s — syncing to heat pump"
                  args: ['id(desired_power_state).state ? "ON" : "OFF"']
              - script.execute: sync_power_state

  # ─── Current Power State (read from BLE notify) ──────────────────────────
  # Reflects the heat pump's actual power state as reported via BLE. May briefly
  # differ from desired_power_state while a sync is in flight, or
  # persistently if someone uses the heat pump's physical control panel
  # (HA helper takes priority on the next sync).
  - platform: template
    id: current_power_state
    name: "Power State"
    icon: "mdi:power"
    device_class: power

  # ── BLE link status ───────────────────────────────────────────────────────
  - platform: template
    id: ble_status
    name: "Heat Pump BLE Connection"
    device_class: connectivity
    lambda: 'return id(ble_connected);'

  # ─── Diagnostic outputs ───────────────────────────────────────────────────
  # output_compressor, output_circulate_pump, output_high_fan and output_4way_valve are 
  # decoded from the bitmask at register 0x07E3 in the notify response.
  - platform: template
    id: output_compressor
    name: "Compressor"
    icon: "mdi:engine"
    device_class: running
    entity_category: diagnostic
    filters:
      - delayed_on_off: 1s    # debounce: only publish if state holds for 1 second to remove the duplicate BLE responses

  - platform: template
    id: output_circulate_pump
    name: "Circulate Pump"
    icon: "mdi:pump"
    device_class: running
    entity_category: diagnostic
    filters:
      - delayed_on_off: 1s    # debounce: only publish if state holds for 1 second to remove the duplicate BLE responses

  - platform: template
    id: output_high_fan
    name: "High Fan"
    icon: "mdi:fan"
    device_class: running
    entity_category: diagnostic
    filters:
      - delayed_on_off: 1s    # debounce: only publish if state holds for 1 second to remove the duplicate BLE responses

  - platform: template
    id: output_4way_valve
    name: "4-Way Valve"
    icon: "mdi:valve"
    device_class: opening
    entity_category: diagnostic
    filters:
      - delayed_on_off: 1s    # debounce: only publish if state holds for 1 second to remove the duplicate BLE responses

  - platform: template
    id: has_error
    name: "Has Error"
    icon: "mdi:alert"
    device_class: problem
    entity_category: diagnostic

  # ─── Temperature sensor fault indicators (P-codes) ─────────────────────────
  # Triggered when temperature register reads heat-pump's "sensor failure"
  # sentinel value. Matches heat-pump's displayed P-codes:
  #   P01=Inlet (T02), P02=Outlet (T03), P04=Ambient (T05),
  #   P05=Coil (T04),  P81=Exhaust (T06)
  - platform: template
    id: inlet_temp_fault
    name: "Inlet Temp Sensor Fault (P01)"
    device_class: problem
    entity_category: diagnostic
    on_state:
      then:
        - component.update: error_description
        - lambda: |-
            bool err = (id(error_code).has_state() && id(error_code).state != 0) ||
                       id(inlet_temp_fault).state ||
                       id(outlet_temp_fault).state ||
                       id(ambient_temp_fault).state ||
                       id(coil_temp_fault).state ||
                       id(exhaust_temp_fault).state;
            id(has_error).publish_state(err);

