                       id(ambient_temp_fault).state ||
                       id(coil_temp_fault).state ||
                       id(exhaust_temp_fault).state;
            id(has_error).publish_state(err);

  # ─── Unit Running State ───────────────────────────────────────────────────
  # Reflects the heat pump's internal "I'm running" state (register 0x07DB).
  # Differs from the power state (0x03F3):
  #   - power state = user's on/off command
  #   - unit state  = "actually running" (may be 0 even when powered on if
  #                   the heat pump has safety-stopped due to a fault).
  - platform: template
    id: unit_running
    name: "Unit Running"
    icon: "mdi:engine"
    device_class: running
    entity_category: diagnostic

# ─── Sensors ────────────────────────────────────────────────────────────────
sensor:
  # ── Desired Target Temperature (HA helper mirror) ─────────────────────────
  # Mirrors the HA helper defined by the global home_assistant_desired_target_temp_number_name.
  # Because the value lives in HA, it can be updated  while the device is asleep
  #   - If the device is awake, the on_value handler writes immediately.
  #   - If asleep, on_boot reads the new value on the next wake and the
  #     ble_client on_connect handler syncs it to the heat pump.
  - platform: homeassistant
    id: desired_target_temp
    entity_id: ${home_assistant_desired_target_temp_number_name}
    on_value:
      then:
        # Apply immediately if the heat pump is reachable. sync_target_temp
        # writes, re-polls, and retries until current_target_temp matches, so
        # a single dropped BLE write no longer silently fails. If BLE is down,
        # the on_connect handler reconciles on the next wake.
        - if:
            condition:
              lambda: 'return id(ble_connected);'
            then:
              - logger.log:
                  level: INFO
                  format: "Helper changed target to %.1f — syncing to heat pump"
                  args: ['id(desired_target_temp).state']
              - script.execute: sync_target_temp

  # ── BLE Notification Parser (internal) ────────────────────────────────────
  # This sensor subscribes to BLE notifications from the heat pump and parses
  # each Modbus reply into the real sensors below. It has no value of its
  # own — returning {} from the lambda means "don't publish".
  #
  # Each notification arrives as a std::vector<uint8_t> in `x`.
  - platform: ble_client
    type: characteristic
    ble_client_id: heatpump_ble
    id: notify_handler
    name: "Heat Pump Raw Notify"
    service_uuid: ${service_uuid}
    characteristic_uuid: ${notify_char_uuid}
    notify: true
    internal: true
    lambda: |-
      // Sanity check
      if (x.size() < 5 || x[0] != 0x63) return {};

      // Write ACK (8-byte Modbus 0x10 response)
      if (x[1] == 0x10 && x.size() == 8) {
        uint16_t ack = (x[2] << 8) | x[3];
        ESP_LOGI("heatpump", "Write ACK for 0x%04X", ack);
        return {};
      }

      // Modbus exception
      if ((x[1] & 0x80) && x.size() >= 5) {
        ESP_LOGW("heatpump", "Modbus exception 0x%02X for func 0x%02X",
                 x[2], x[1] & 0x7F);
        return {};
      }

      // Data block (fragmented read response).
      // Format: 63 10 [block_hi] [block_lo] 00 2D 5A [9 regs of data...]
      if (x[1] != 0x10 || x.size() < 9) return {};

      uint16_t block = (x[2] << 8) | x[3];
      auto rd = [&](size_t i) -> int16_t {
        size_t p = 7 + i * 2;
        if (p + 1 >= x.size()) return 0;
        return (int16_t)((x[p] << 8) | x[p+1]);
      };

      if (block == 0x07FE) {
        // Sensor failure detection. The heat pump signals different
        // failure values per sensor:
        //   T02 Inlet, T03 Outlet, T04 Coil, T06 Exhaust → 0x7FFD
        //   T05 Ambient                                  → 0xFFF6 (-1.0°C)
        // T01 Suction always reads 0x7FFD on single-system models.
        auto pub_temp = [](esphome::template_::TemplateSensor *temp_sensor,
                           esphome::template_::TemplateBinarySensor *fault_sensor,
                           int16_t raw,
                           bool is_ambient) {
          bool fault;
          if (is_ambient) {
            fault = (raw == (int16_t)0xFFF6) || ((raw & 0xFFF0) == 0x7FF0);
          } else {
            fault = ((raw & 0xFFF0) == 0x7FF0);
          }
          fault_sensor->publish_state(fault);
          if (fault) {
            temp_sensor->publish_state(NAN);
          } else {
            temp_sensor->publish_state(raw / 10.0);
          }
        };

        pub_temp(id(inlet_temp),   id(inlet_temp_fault),   rd(1), false);
        pub_temp(id(outlet_temp),  id(outlet_temp_fault),  rd(2), false);
        pub_temp(id(coil_temp),    id(coil_temp_fault),    rd(3), false);
        pub_temp(id(ambient_temp), id(ambient_temp_fault), rd(4), true);
        pub_temp(id(exhaust_temp), id(exhaust_temp_fault), rd(5), false);
        ESP_LOGI("heatpump", "Temps updated");

      } else if (block == 0x0416) {
        // Each mode has its own target register in this block:
        //   reg 0  (0x0416) = R01 Heating set
        //   reg 5  (0x041B) = R06 Cooling set
        //   reg 22 (0x042C) = R11 Auto set
        // The heat pump's display shows whichever matches the current mode,
        // so we mirror that here.
        std::string mode_str = id(current_mode).has_state()
                               ? id(current_mode).state
                               : std::string("Heat");
        float displayed_target;
        if (mode_str == "Cool")      displayed_target = rd(5)  / 10.0;
        else if (mode_str == "Auto") displayed_target = rd(22) / 10.0;
        else                         displayed_target = rd(0)  / 10.0;
        id(current_target_temp).publish_state(displayed_target);
        ESP_LOGI("heatpump", "Target (%s mode) = %.1f",
                 mode_str.c_str(), displayed_target);

        // Diagnostic sensors — always publish all three set-points
        id(heating_set_temp).publish_state(rd(0) / 10.0);
        id(cooling_set_temp).publish_state(rd(5) / 10.0);
        id(auto_set_temp).publish_state(rd(22) / 10.0);
        id(min_heat_temp).publish_state(rd(3) / 10.0);
        id(max_heat_temp).publish_state(rd(4) / 10.0);
        id(min_cool_temp).publish_state(rd(8) / 10.0);
        id(max_cool_temp).publish_state(rd(9) / 10.0);

        // D06 Defrost type at reg 15 (0x0425): 0=Normal, 1=Eco
        int16_t dt = rd(15);
        id(defrost_type).publish_state(
          dt == 0 ? std::string("Normal") :
          dt == 1 ? std::string("Eco") :
          std::string("Unknown"));

        ESP_LOGI("heatpump", "Heat Pump target = %.1f", rd(0) / 10.0);
      } else if (block == 0x03E9) {
        // Block containing register 0x03F3 at offset 10 = power state
        int16_t power = rd(10);
        bool is_on = (power != 0);
        id(current_power_state).publish_state(is_on);

        // Mode at offset 11 (register 0x03F4)
        // 0 = Cool, 1 = Heat, 2 = Auto
        int16_t mode = rd(11);
        const char *mode_str;
        switch (mode) {
          case 0:  mode_str = "Cool"; break;
          case 1:  mode_str = "Heat"; break;
          case 2:  mode_str = "Auto"; break;
          default: mode_str = "Unknown"; break;
        }
        id(current_mode).publish_state(std::string(mode_str));

        // H06 Mode type at reg 22 (0x03FF): 1=Heat pump, 2=Heat only (4-way valve)
        int16_t mt = rd(22);
        id(heater_mode_type).publish_state(
          mt == 1 ? std::string("Heat pump") :
          mt == 2 ? std::string("Heat only (4-way valve)") :
          std::string("Unknown"));

        // P01 Circulating pump mode at reg 36 (0x040D): 0=Normal, 1=Stop, 2=Interval
        int16_t pm = rd(36);
        id(pump_mode).publish_state(
          pm == 0 ? std::string("Normal") :
          pm == 1 ? std::string("Stop") :
          pm == 2 ? std::string("Interval") :
          std::string("Unknown"));

        ESP_LOGI("heatpump", "Heat Pump power=%s mode=%s", is_on ? "ON" : "OFF", mode_str);

      } else if (block == 0x07D1) {
        // Block containing output states at offset 18 (register 0x07E3).
        // Bitmask:
        //   bit 0 (0x01) = compressor  (confirmed via capture)
        //   bit 1 (0x02) = circulate pump  (inferred from app O01-O04 order)
        //   bit 2 (0x04) = high fan  (confirmed via capture)
        //   bit 3 (0x08) = 4-way valve  (inferred from app O01-O04 order)
        int16_t outputs = rd(18);
        id(output_compressor).publish_state((outputs & 0x01) != 0);
        id(output_circulate_pump).publish_state((outputs & 0x02) != 0);
        id(output_high_fan).publish_state((outputs & 0x04) != 0);
        id(output_4way_valve).publish_state((outputs & 0x08) != 0);

        // Firmware identity (block 0x07D1 reg 16 + reg 17).
        // These are stable across reads — published once per session.
        // reg 16 (0x07E1) = "Master program version number", DIGI5 (×10)
        //                   e.g. raw 12 → "1.2"
        // reg 17 (0x07E2) = "Main control software code", DIGI1 (raw)
        //                   e.g. 494
        uint16_t master_ver_raw = rd(16);
        uint16_t soft_code      = rd(17);

        char ver_buf[16];
        snprintf(ver_buf, sizeof(ver_buf), "%u.%u",
                 master_ver_raw / 10, master_ver_raw % 10);
        std::string ver_str(ver_buf);
        if (!id(master_program_version).has_state() ||
            id(master_program_version).state != ver_str) {
          id(master_program_version).publish_state(ver_str);
        }

        char code_buf[16];
        snprintf(code_buf, sizeof(code_buf), "%u", soft_code);
        std::string code_str(code_buf);
        if (!id(main_control_software_code).has_state() ||
            id(main_control_software_code).state != code_str) {
          id(main_control_software_code).publish_state(code_str);
        }

        // Unit running state at offset 10 (register 0x07DB).
        // 0 = stopped (may indicate self-shutdown), 1 = running.
        id(unit_running).publish_state(rd(10) != 0);

        // Error code at offset 33 (register 0x07F2).
        // 0 = no error; 4 = E03 (water flow) confirmed via BLE capture, but see comment below on
        // error_code and error_description sensor for more details on the raw code and display mapping.
        int16_t err = rd(33);
        id(error_code).publish_state(err);

        ESP_LOGI("heatpump", "Outputs = 0x%04X, Error = 0x%04X", outputs, err);
      }
      return {};

  # ── Temperature sensors (parsed from BLE notifications) ───────────────────
  - platform: template
    id: inlet_temp
    name: "Inlet Water Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C to remove the duplicate BLE responses

  - platform: template
    id: outlet_temp
    name: "Outlet Water Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C to remove the duplicate BLE responses

  - platform: template
    id: coil_temp
    name: "Coil Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C to remove the duplicate BLE responses

  - platform: template
    id: ambient_temp
    name: "Ambient Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C to remove the duplicate BLE responses

  - platform: template
    id: exhaust_temp
    name: "Exhaust Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C to remove the duplicate BLE responses

  # ── Current Heat Pump Target (read-only) ─────────────────────────────────────
  # Reflects what the heat pump itself currently thinks the target is, as
  # reported via BLE. May briefly differ from `desired_target_temp` while
  # a sync is in flight, or persistently if someone changes the target on
  # the heat pump's physical control panel (the HA helper takes priority and
  # will overwrite on the next sync).
  - platform: template
    id: current_target_temp
    name: "Current Target Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - delta: 0.05   # only publish if value moved more than 0.05°C to remove the duplicate BLE responses

  # ─── Heat Pump Error Code (raw value) ─────────────────────────────────────────
  # Reads register 0x07F2 from the heat pump. 0 = no error, non-zero = fault.
  # The display shows error codes like E03 which appear to map to internal
  # values with an off-by-one offset (E03 = value 4) OR a bitmask (E03 = Bit 2 aka 0x04).
  # I haven't fully decoded the mapping yet, but capturing the raw code here allows 
  # for future decoding as more faults are encountered.
  - platform: template
    id: error_code
    name: "Error Code"
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    accuracy_decimals: 0
    # Set from the BLE notify parser, never independently polled
    update_interval: never
    # When the raw code changes, push a translated description and the
    # has-error binary state
    on_value:
      then:
        - component.update: error_description
        - lambda: |-
            bool err = (id(error_code).state != 0) ||
                       id(inlet_temp_fault).state ||
                       id(outlet_temp_fault).state ||
                       id(ambient_temp_fault).state ||
                       id(coil_temp_fault).state ||
                       id(exhaust_temp_fault).state;
            id(has_error).publish_state(err);

  # ─── R-tab setpoint diagnostics ────────────────────────────────────────────
  - platform: template
    id: heating_set_temp
    name: "Heating Set Temp (R01)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - delta: 0.05

  - platform: template
    id: cooling_set_temp
    name: "Cooling Set Temp (R06)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - delta: 0.05

  - platform: template
    id: auto_set_temp
    name: "Auto Set Temp (R11)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - delta: 0.05

  - platform: template
    id: min_heat_temp
    name: "Min Heat Limit (R04)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: template
    id: max_heat_temp
    name: "Max Heat Limit (R05)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: template
    id: min_cool_temp
    name: "Min Cool Limit (R09)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: template
    id: max_cool_temp
    name: "Max Cool Limit (R10)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    entity_category: diagnostic

  # ── Battery Voltage ───────────────────────────────────────────────────────
  # The Firebeetle 2 ESP32-C6 has an onboard 1:1 voltage divider on GPIO0.
  # 12dB attenuation gives the ADC a ~3.1V max range; the multiply: 2.0
  # filter restores the actual cell voltage (LiPo 3.0–4.2V).
  - platform: adc
    pin: GPIO0
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 5min
    attenuation: 12db
    filters:
      - multiply: 2.0
      # Smooth ADC noise across 3 readings, publish every time so the
      # brief wake window always gets a value out before sleep.
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    on_value:
      then:
        # Refresh derived battery percentage whenever voltage updates.
        # Prevents a race where battery_level evaluates before
        # battery_voltage has a valid reading.
        - component.update: battery_level

  # ── Battery Percentage (derived from voltage) ─────────────────────────────
  # Simple linear curve: 3.0V = 0%, 4.2V = 100%. Good enough as a rough
  # state-of-charge indicator. For better accuracy, replace with a
  # piecewise discharge curve specific to your cell chemistry.
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    # Never poll independently — only updated via on_value above.
    update_interval: never
    lambda: |-
      float v = id(battery_voltage).state;
      if (isnan(v)) return {};
      float pct = (v - 3.0f) / (4.2f - 3.0f) * 100.0f;
      return clamp(pct, 0.0f, 100.0f);

# ─── Text Sensors ───────────────────────────────────────────────────────────
text_sensor:
  # Wall-clock time the device last came online and synced with HA. Acts as a
  # heartbeat: if this value stops updating, the device isn't waking properly.
  # update_interval is 'never' — it's published explicitly: from on_time_sync
  # (fresh stamp each wake, both sleep modes) and from on_boot Phase 0 (the
  # retained value, republished before the API connects so HA never sees
  # 'unknown'). The value itself lives in the retained last_connected_str
  # global; this lambda just surfaces it.
  - platform: template
    name: "Last Connected"
    id: last_connected
    icon: "mdi:clock-outline"
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      // Nothing stored yet (first-ever boot) — stay unknown rather than
      // publish an empty string.
      if (id(last_connected_str)[0] == '\0') return {};
      return std::string(id(last_connected_str));

  # ─── Desired Mode (mirror of HA helper) ──────────────────────────────────
  # Mirrors the input_select helper. Like the other mirrored helpers, the
  # value lives in HA so it can be changed while the device is asleep — the
  # new state is read on the next wake and applied via on_connect.
  #
  # Expected values: "Heat", "Cool", "Auto"
  - platform: homeassistant
    id: desired_mode
    entity_id: ${home_assistant_desired_mode_select_name}
    on_value:
      then:
        # Apply immediately if the heat pump is reachable. sync_mode writes,
        # re-polls, and retries until current_mode matches. If BLE is down,
        # the on_connect handler reconciles on the next wake.
        - if:
            condition:
              lambda: 'return id(ble_connected);'
            then:
              - logger.log:
                  level: INFO
                  format: "Helper changed mode to %s — syncing to heat pump"
                  args: ['id(desired_mode).state.c_str()']
              - script.execute: sync_mode
              - script.wait: sync_mode

              # sync_mode's final poll has refreshed current_target_temp from
              # the NEW mode's register. Now push the desired target into it so
              # the setpoint carries across the mode change (sync_target_temp
              # no-ops if it already matches).
              - script.execute: sync_target_temp

  # ─── Current Mode (read from BLE notify) ─────────────────────────────────
  # Reflects the heat pump's actual mode as reported via BLE. Updated by the
  # notify parser when block 0x03E9 arrives — register 0x03F4 at offset 11.
  - platform: template
    id: current_mode
    name: "Current Mode"
    icon: "mdi:thermostat"

  # ─── Heat Pump Error Description ─────────────────────────────────────────────
  # Translates the raw error code into the display code (E0n) and a
  # description. Add new mappings here as you observe other faults.
  #
  # Confirmed mappings (from BLE capture analysis):
  #   value 0 → No error
  #   value 4 → E03: Water Flow (heat pump shows "E03" on its display)
  #
  # Other codes may be added once observed.
  - platform: template
    name: "Error Description"
    id: error_description
    icon: "mdi:alert-circle-outline"
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      // ── Aggregate all active faults: E-codes from error register +
      //    P-codes from temperature sensor failures ──
      std::string result;
      auto append = [&](const std::string &s) {
        if (!result.empty()) result += "; ";
        result += s;
      };

      // E-codes from error register (bitmask at 0x07F2)
      if (id(error_code).has_state()) {
        uint16_t code = (uint16_t)(int)id(error_code).state;
        // Confirmed/inferred mappings on this model:
        if (code & 0x0001) append("E01 High pressure protection");  // bit 0 — inferred
        if (code & 0x0002) append("E02 Low pressure protection");   // bit 1 — confirmed
        if (code & 0x0004) append("E03 No water flow");              // bit 2 — confirmed
        uint16_t known = 0x0007;
        uint16_t unknown = code & ~known;
        if (unknown) {
          char buf[40];
          snprintf(buf, sizeof(buf), "E-unknown bits 0x%04X", unknown);
          append(buf);
        }
      }

      // P-codes from temperature sensor failures
      if (id(inlet_temp_fault).state)   append("P01 Inlet sensor");
      if (id(outlet_temp_fault).state)  append("P02 Outlet sensor");
      if (id(ambient_temp_fault).state) append("P04 Ambient sensor");
      if (id(coil_temp_fault).state)    append("P05 Coil sensor");
      if (id(exhaust_temp_fault).state) append("P81 Exhaust sensor");

      return result.empty() ? std::string("OK") : result;

  # ─── Advanced settings (read-only diagnostics) ────────────────────────────
  # Although it is understood how to set these, it may be dangerous to set them
  # incorrectly so they're implemented as read-only diagnostics for now.
  # Change them using the AquaTemp app and the password "66" for the
  # device parameters menu.
  - platform: template
    id: defrost_type
    name: "Defrost Type"
    icon: "mdi:snowflake-melt"
    entity_category: diagnostic

  - platform: template
    id: heater_mode_type
    name: "Heat Pump Mode Type"
    icon: "mdi:cog"
    entity_category: diagnostic

  - platform: template
    id: pump_mode
    name: "Circulating Pump Mode"
    icon: "mdi:pump"
    entity_category: diagnostic

  # ─── Master Program Version (register 0x07E1) ─────────────────────────────
  # Displayed on the heat pump's control panel as "Master program version
  # number". A DIGI5 value (scaled ×10), so raw 12 = "1.2".
  - platform: template
    name: "Master Program Version"
    id: master_program_version
    icon: "mdi:chip"
    entity_category: diagnostic

  # ─── Main Control Software Code (register 0x07E2) ─────────────────────────
  # Displayed on the heat pump's control panel as "Main control software
  # code". A DIGI1 value (raw integer build code), e.g. 494.
  - platform: template
    name: "Main Control Software Code"
    id: main_control_software_code
    icon: "mdi:chip"
    entity_category: diagnostic

# ─── Scripts ────────────────────────────────────────────────────────────────
script:
  # Send the Modbus "read all status" command to the heat pump.
  # The heat pump replies with 4 fragmented notifications covering blocks
  # 0x03E9, 0x0416, 0x07D1, 0x07FE — the BLE notify parser above picks
  # them apart and publishes to the real sensors.
  - id: poll_heat_pump
    then:
      - ble_client.ble_write:
          id: heatpump_ble
          service_uuid: ${service_uuid}
          characteristic_uuid: ${write_char_uuid}
          value: [0x63, 0x03, 0x00, 0x07, 0x00, 0x2D, 0x3C, 0x54]

  # Write a new target temperature to the register appropriate to the
  # current operating mode:
  #   Heat → 0x0416 (R01 Heating set)
  #   Cool → 0x041B (R06 Cooling set)
  #   Auto → 0x042C (R11 Auto set)
  #
  # If the current mode isn't known yet (e.g. first connect after wake
  # before the heat pump has been polled), default to heat target — that's
  # the most common case and matches the previous behaviour.
  - id: write_target_temp
    parameters:
      temp_x10: int
    then:
      - ble_client.ble_write:
          id: heatpump_ble
          service_uuid: ${service_uuid}
          characteristic_uuid: ${write_char_uuid}
          value: !lambda |-
            // Pick the right register based on current mode
            std::string mode_str = id(current_mode).has_state()
                                   ? id(current_mode).state
                                   : std::string("Heat");
            uint8_t addr_hi = 0x04, addr_lo = 0x16;  // default: heat
            if (mode_str == "Cool") {
              addr_hi = 0x04; addr_lo = 0x1B;
            } else if (mode_str == "Auto") {
              addr_hi = 0x04; addr_lo = 0x2C;
            }

            // Clamp to the mode-appropriate range
            if (mode_str == "Cool") {
              if (temp_x10 < 100) temp_x10 = 100;   // R09 Min cool = 10°C
              if (temp_x10 > 350) temp_x10 = 350;   // R10 Max cool = 35°C
            } else {
              // Heat & Auto both use heat range
              if (temp_x10 < 150) temp_x10 = 150;   // R04 Min heat = 15°C
              if (temp_x10 > 400) temp_x10 = 400;   // R05 Max heat = 40°C
            }

            std::vector<uint8_t> msg = {
              0x63, 0x10, addr_hi, addr_lo, 0x00, 0x01, 0x02,
              (uint8_t)((temp_x10 >> 8) & 0xFF),
              (uint8_t)(temp_x10 & 0xFF)
            };
            uint16_t crc = 0xFFFF;
            for (auto b : msg) {
              crc ^= b;
              for (int j = 0; j < 8; j++)
                crc = (crc & 1) ? ((crc >> 1) ^ 0xA001) : (crc >> 1);
            }
            msg.push_back(crc & 0xFF);
            msg.push_back((crc >> 8) & 0xFF);
            ESP_LOGI("heatpump", "Set %s target = %.1f (reg 0x%02X%02X)",
                     mode_str.c_str(), temp_x10 / 10.0, addr_hi, addr_lo);
            return msg;

  # Reconcile the heat pump's target temperature with the desired (HA helper)
  # value, with verification and retry — same pattern as sync_power_state.
  # After each write we re-poll and re-check current_target_temp; if it still
  # differs (beyond the 0.05°C float tolerance) we try again, up to a cap.
  #
  # Note: write_target_temp clamps to the active mode's range, so if the
  # desired value is outside that range the loop will retry to the cap and
  # then warn — the clamped value is the best the heat pump will accept.
  - id: sync_target_temp
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(desired_target_temp).has_state() && id(ble_connected);'
          then:
            - lambda: 'id(target_sync_attempts) = 0;'
            - while:
                condition:
                  lambda: |-
                    if (!id(ble_connected)) return false;
                    if (id(target_sync_attempts) >= 3) return false;
                    // No reading yet — loop so we write and poll to get one.
                    if (!id(current_target_temp).has_state()) return true;
                    // 0.05°C tolerance avoids spurious writes from float
                    // precision (heat pump stores in 0.1°C steps).
                    return fabsf(id(desired_target_temp).state -
                                 id(current_target_temp).state) > 0.05f;
                then:
                  - lambda: 'id(target_sync_attempts) += 1;'
                  - logger.log:
                      level: INFO
                      format: "Syncing target (attempt %d/3): HA=%.1f"
                      args: ['id(target_sync_attempts)',
                             'id(desired_target_temp).state']
                  - script.execute:
                      id: write_target_temp
                      temp_x10: !lambda 'return (int)(id(desired_target_temp).state * 10);'
                  - delay: 2s
                  - script.execute: poll_heat_pump
                  - delay: 3s
            - lambda: |-
                bool synced = id(current_target_temp).has_state() &&
                              fabsf(id(desired_target_temp).state -
                                    id(current_target_temp).state) <= 0.05f;
                if (synced) {
                  ESP_LOGI("heatpump", "Target confirmed: %.1f",
                           id(desired_target_temp).state);
                } else {
                  ESP_LOGW("heatpump",
                           "Target NOT confirmed after %d attempts (HA=%.1f) — "
                           "will retry on next reconcile",
                           id(target_sync_attempts), id(desired_target_temp).state);
                }

  # Write the power on/off state to register 0x03F3.
  # Captured commands:
  #   OFF: 63 10 03 F3 00 01 02 00 00 30 F1
  #   ON:  63 10 03 F3 00 01 02 00 01 F1 31
  - id: write_power_state
    parameters:
      power_on: bool
    then:
      - ble_client.ble_write:
          id: heatpump_ble
          service_uuid: ${service_uuid}
          characteristic_uuid: ${write_char_uuid}
          value: !lambda |-
            uint8_t val = power_on ? 0x01 : 0x00;
            std::vector<uint8_t> msg = {
              0x63, 0x10, 0x03, 0xF3, 0x00, 0x01, 0x02, 0x00, val
            };
            // CRC16 (Modbus RTU)
            uint16_t crc = 0xFFFF;
            for (auto b : msg) {
              crc ^= b;
              for (int j = 0; j < 8; j++)
                crc = (crc & 1) ? ((crc >> 1) ^ 0xA001) : (crc >> 1);
            }
            msg.push_back(crc & 0xFF);
            msg.push_back((crc >> 8) & 0xFF);
            ESP_LOGI("heatpump", "Set power = %s", power_on ? "ON" : "OFF");
            return msg;

  # Reconcile the heat pump's power state with the desired (HA helper) state,
  # with verification and retry. A single BLE write to 0x03F3 is occasionally
  # dropped, so after each write we re-poll and re-check current_power_state;
  # if it still disagrees we try again, up to a small cap. This is what makes
  # power toggles reliable in deep-sleep mode, where there's only one brief
  # wake window to get it right.
  #
  # mode: restart — a new toggle while a sync is in flight restarts it cleanly
  # with the latest desired value.
  - id: sync_power_state
    mode: restart
    then:
      - if:
          condition:
            # Need a desired value to aim for and a live BLE link to poll/write.
            lambda: 'return id(desired_power_state).has_state() && id(ble_connected);'
          then:
            - lambda: 'id(power_sync_attempts) = 0;'
            - while:
                condition:
                  lambda: |-
                    // Stop if BLE dropped or we've exhausted our retries.
                    if (!id(ble_connected)) return false;
                    if (id(power_sync_attempts) >= 3) return false;
                    // No reading yet — loop so we write and poll to get one.
                    if (!id(current_power_state).has_state()) return true;
                    // Otherwise keep going only while the states disagree.
                    return id(desired_power_state).state != id(current_power_state).state;
                then:
                  - lambda: 'id(power_sync_attempts) += 1;'
                  - logger.log:
                      level: INFO
                      format: "Syncing power (attempt %d/3): HA=%s"
                      args: ['id(power_sync_attempts)',
                             'id(desired_power_state).state ? "ON" : "OFF"']
                  - script.execute:
                      id: write_power_state
                      power_on: !lambda 'return id(desired_power_state).state;'
                  # Let the write apply, then re-poll and wait for the notify
                  # response so current_power_state reflects reality before the
                  # while condition re-evaluates.
                  - delay: 2s
                  - script.execute: poll_heat_pump
                  - delay: 3s
            # Report the outcome so the logs make a failure obvious.
            - lambda: |-
                bool synced = id(current_power_state).has_state() &&
                              id(desired_power_state).state == id(current_power_state).state;
                if (synced) {
                  ESP_LOGI("heatpump", "Power state confirmed: %s",
                           id(desired_power_state).state ? "ON" : "OFF");
                } else {
                  ESP_LOGW("heatpump",
                           "Power state NOT confirmed after %d attempts (HA=%s) — "
                           "will retry on next reconcile",
                           id(power_sync_attempts),
                           id(desired_power_state).state ? "ON" : "OFF");
                }

  # Write the operating mode to register 0x03F4 (and 0x03F5).
  # The app writes 2 consecutive registers — we replicate that exactly to
  # match observed behaviour. Register 0x03F5's purpose isn't fully
  # understood but appears mode-dependent.
  #
  # Captured commands (CRCs verified, labels corrected — 0x00 is Cool, 0x01 is Heat):
  #   COOL: 63 10 03 F4 00 02 04 00 00 00 00 1C 51
  #   HEAT: 63 10 03 F4 00 02 04 00 01 00 88 4D F7
  #   AUTO: 63 10 03 F4 00 02 04 00 02 00 8C BC 34
  - id: write_mode
    parameters:
      mode: string
    then:
      - ble_client.ble_write:
          id: heatpump_ble
          service_uuid: ${service_uuid}
          characteristic_uuid: ${write_char_uuid}
          value: !lambda |-
            // Translate string mode to (mode_val, second_reg) pair.
            // The second register's exact meaning is unknown but the values
            // below match what the official AquaTemp app sends.
            // Note: 0x00 = Cool, 0x01 = Heat, 0x02 = Auto (confirmed by observation).
            uint8_t mode_lo, sec_hi, sec_lo;
            if (mode == "Heat") {
              mode_lo = 0x01; sec_hi = 0x00; sec_lo = 0x88;
            } else if (mode == "Cool") {
              mode_lo = 0x00; sec_hi = 0x00; sec_lo = 0x00;
            } else if (mode == "Auto") {
              mode_lo = 0x02; sec_hi = 0x00; sec_lo = 0x8C;
            } else {
              // Default to Heat for any unrecognised string
              mode_lo = 0x01; sec_hi = 0x00; sec_lo = 0x88;
            }

            std::vector<uint8_t> msg = {
              0x63, 0x10, 0x03, 0xF4, 0x00, 0x02, 0x04,
              0x00, mode_lo,
              sec_hi, sec_lo
            };
            // CRC16 (Modbus RTU)
            uint16_t crc = 0xFFFF;
            for (auto b : msg) {
              crc ^= b;
              for (int j = 0; j < 8; j++)
                crc = (crc & 1) ? ((crc >> 1) ^ 0xA001) : (crc >> 1);
            }
            msg.push_back(crc & 0xFF);
            msg.push_back((crc >> 8) & 0xFF);
            ESP_LOGI("heatpump", "Set mode = %s", mode.c_str());
            return msg;

  # Reconcile the heat pump's operating mode with the desired (HA helper)
  # value, with verification and retry — same pattern as sync_power_state.
  # After each write we re-poll and re-check current_mode; if it still differs
  # we try again, up to a cap. Callers that need the target re-pushed into the
  # new mode's register should run sync_target_temp after this completes.
  - id: sync_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(desired_mode).has_state() && id(ble_connected);'
          then:
            - lambda: 'id(mode_sync_attempts) = 0;'
            - while:
                condition:
                  lambda: |-
                    if (!id(ble_connected)) return false;
                    if (id(mode_sync_attempts) >= 3) return false;
                    // No reading yet — loop so we write and poll to get one.
                    if (!id(current_mode).has_state()) return true;
                    return id(desired_mode).state != id(current_mode).state;
                then:
                  - lambda: 'id(mode_sync_attempts) += 1;'
                  - logger.log:
                      level: INFO
                      format: "Syncing mode (attempt %d/3): HA=%s"
                      args: ['id(mode_sync_attempts)',
                             'id(desired_mode).state.c_str()']
                  - script.execute:
                      id: write_mode
                      mode: !lambda 'return id(desired_mode).state;'
                  - delay: 2s
                  - script.execute: poll_heat_pump
                  - delay: 3s
            - lambda: |-
                bool synced = id(current_mode).has_state() &&
                              id(desired_mode).state == id(current_mode).state;
                if (synced) {
                  ESP_LOGI("heatpump", "Mode confirmed: %s",
                           id(desired_mode).state.c_str());
                } else {
                  ESP_LOGW("heatpump",
                           "Mode NOT confirmed after %d attempts (HA=%s) — "
                           "will retry on next reconcile",
                           id(mode_sync_attempts), id(desired_mode).state.c_str());
                }

  # Choose the correct deep sleep duration based on the current time of day,
  # then enter deep sleep. Called from on_boot and from the prevent-deep-sleep
  # on_state handler so the schedule is respected in both cases.
  # Falls back to deep_sleep_duration_night if HA time has not yet synced.
  - id: enter_deep_sleep_scheduled
    then:
      # Snapshot every BLE-derived sensor's current state into the retained
      # globals so the next wake can republish them in on_boot Phase 0 before
      # any BLE data arrives — eliminating the 'unknown' HA otherwise records
      # in the ~30 s gap between API connect and the first poll. This is the
      # single chokepoint before every deep sleep (called from on_boot and the
      # prevent-deep-sleep off handler), so it's the right place to capture.
      # Guarded on has_state() so we never persist garbage for a sensor that
      # was never populated; floats left at their NAN initial value republish
      # as 'unavailable'.
      - lambda: |-
          if (id(inlet_temp).has_state())            id(g_inlet_temp)    = id(inlet_temp).state;
          if (id(outlet_temp).has_state())           id(g_outlet_temp)   = id(outlet_temp).state;
          if (id(coil_temp).has_state())             id(g_coil_temp)     = id(coil_temp).state;
          if (id(ambient_temp).has_state())          id(g_ambient_temp)  = id(ambient_temp).state;
          if (id(exhaust_temp).has_state())          id(g_exhaust_temp)  = id(exhaust_temp).state;
          if (id(current_target_temp).has_state())   id(g_target_temp)   = id(current_target_temp).state;
          if (id(heating_set_temp).has_state())      id(g_heating_set)   = id(heating_set_temp).state;
          if (id(cooling_set_temp).has_state())      id(g_cooling_set)   = id(cooling_set_temp).state;
          if (id(auto_set_temp).has_state())         id(g_auto_set)      = id(auto_set_temp).state;
          if (id(min_heat_temp).has_state())         id(g_min_heat)      = id(min_heat_temp).state;
          if (id(max_heat_temp).has_state())         id(g_max_heat)      = id(max_heat_temp).state;
          if (id(min_cool_temp).has_state())         id(g_min_cool)      = id(min_cool_temp).state;
          if (id(max_cool_temp).has_state())         id(g_max_cool)      = id(max_cool_temp).state;

          if (id(current_power_state).has_state())   id(g_power)         = id(current_power_state).state;
          if (id(unit_running).has_state())          id(g_unit_running)  = id(unit_running).state;
          if (id(output_compressor).has_state())     id(g_out_compressor)= id(output_compressor).state;
          if (id(output_circulate_pump).has_state()) id(g_out_pump)      = id(output_circulate_pump).state;
          if (id(output_high_fan).has_state())       id(g_out_fan)       = id(output_high_fan).state;
          if (id(output_4way_valve).has_state())     id(g_out_valve)     = id(output_4way_valve).state;
          if (id(inlet_temp_fault).has_state())      id(g_f_inlet)       = id(inlet_temp_fault).state;
          if (id(outlet_temp_fault).has_state())     id(g_f_outlet)      = id(outlet_temp_fault).state;
          if (id(ambient_temp_fault).has_state())    id(g_f_ambient)     = id(ambient_temp_fault).state;
          if (id(coil_temp_fault).has_state())       id(g_f_coil)        = id(coil_temp_fault).state;
          if (id(exhaust_temp_fault).has_state())    id(g_f_exhaust)     = id(exhaust_temp_fault).state;

          if (id(error_code).has_state())            id(g_error_code)    = (int)id(error_code).state;

          auto save_str = [](esphome::text_sensor::TextSensor *s, char *dst, size_t n) {
            if (!s->has_state()) return;
            strncpy(dst, s->state.c_str(), n - 1);
            dst[n - 1] = '\0';
          };
          save_str(id(current_mode),              id(current_mode_str), sizeof(id(current_mode_str)));
          save_str(id(defrost_type),              id(g_defrost),        sizeof(id(g_defrost)));
          save_str(id(heater_mode_type),          id(g_heater_type),    sizeof(id(g_heater_type)));
          save_str(id(pump_mode),                 id(g_pump_mode),      sizeof(id(g_pump_mode)));
          save_str(id(master_program_version),    id(g_master_ver),     sizeof(id(g_master_ver)));
          save_str(id(main_control_software_code),id(g_soft_code),      sizeof(id(g_soft_code)));

          id(snapshot_valid) = true;

      # Let the globals' own 1 s poll stage the values we just set into their
      # preference buffers BEFORE we sync to flash below. This delay is the
      # crux of the fix: a restore_value global does NOT write itself when you
      # assign it. RestoringGlobalsComponent is a PollingComponent — it only
      # stages its value (rtc_.save) from update(), which fires every 1 s, or
      # from on_shutdown. The assignments above merely change the in-RAM value;
      # nothing is staged yet. Without this pause the global_preferences->sync()
      # that follows runs in the very next action (no main-loop iteration in
      # between, so no poll has run) and therefore commits the *stale* buffers —
      # snapshot_valid=false, floats NAN, strings empty — and deep_sleep.enter
      # then sleeps before the next poll could stage the fresh values, losing
      # them every cycle. That is why every BLE-derived sensor read 'unknown'
      # each wake (snapshot_valid restored false → Phase 0 skipped the
      # republish) while Last Connected worked: last_connected_str is set back
      # in on_time_sync, seconds before sleep, so its poll had already staged it
      # by the time sync ran. A delay > the 1 s poll interval guarantees every
      # global's update() fires at least once and stages the new value.
      - delay: 1200ms

      # Force the now-staged preferences (the snapshot above, plus
      # last_connected_str) to flash. ESPHome's periodic flush interval is far
      # longer than a wake cycle, so without this explicit sync the values
      # written this wake would not survive the imminent deep sleep.
      - lambda: 'global_preferences->sync();'
      - if:
          condition:
            lambda: |-
              auto now = id(ha_time).now();
              return now.is_valid()
                     && now.hour >= ${day_start_hour}
                     && now.hour < ${day_end_hour};
          then:
            - logger.log:
                level: INFO
                format: "Entering deep sleep (day — ${deep_sleep_duration_day})"
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: ${deep_sleep_duration_day}
          else:
            - logger.log:
                level: INFO
                format: "Entering deep sleep (night — ${deep_sleep_duration_night})"
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: ${deep_sleep_duration_night}

# ─── Periodic Polling (only effective while awake) ──────────────────────────
# When prevent_deep_sleep is on, the device stays awake and this interval
# fires every 30s to refresh sensors. During sleep cycles we sleep long
# before 30s elapses, so this never runs — each wake cycle does its own
# single poll from the on_connect handler.
interval:
  - interval: 30s
    then:
      - script.execute: poll_heat_pump