name: ESPHome build

# CI: compile the ESPHome firmware to validate the config and lambdas.
# Full `esphome compile` of the device config. This type-checks the ~50 inline
# C++ lambdas (parsing, CRC, frame building, the deep-sleep snapshot logic)
# that nothing otherwise validates until the firmware is flashed to hardware.
# A green build here means the YAML schema is valid *and* the generated C++
# compiles for the real target board.
#
# No `paths:` filter: this check is a required status check in branch
# protection, and a required check that is *skipped* (e.g. a docs-only PR that
# doesn't touch the YAML) leaves the PR stuck "Expected — waiting for status"
# and unmergeable forever. Running on every PR and every push to main keeps the
# required check honest — it always reports a real pass/fail. The compile is
# the only meaningful validation in this single-config repo, so the occasional
# run on a docs-only change is a cheap price for never deadlocking a merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The config pulls every credential from secrets.yaml via !secret, so a
      # compile needs the file present. These are throwaway CI values, never the
      # real device secrets — the build only needs them to be well-formed:
      #   * the API encryption key must be base64-encoded 32 bytes
      #   * the device MAC must be a valid XX:XX:XX:XX:XX:XX address
      #   * the AP fallback password must be at least 8 characters
      - name: Generate throwaway secrets.yaml
        run: |
          cat > secrets.yaml <<EOF
          wifi_ssid: "ci-ssid"
          wifi_password: "ci-wifi-password"
          ap_fallback_password: "ci-fallback-password"
          ota_password: "ci-ota-password"
          pool_heatpump_proxy_api_key: "$(openssl rand -base64 32)"
          pool_heatpump_proxy_device_mac_address: "AA:BB:CC:DD:EE:FF"
          EOF

      - name: esphome compile
        uses: esphome/build-action@v6
        with:
          yaml-file: pool-heatpump-proxy.yaml

  phnix-lib:
    name: phnix library tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Host-build and unit-test the platform-agnostic protocol library. No ESP
      # toolchain needed — just a C++17 compiler and CMake (both preinstalled on
      # the runner). This is the fast, TDD-friendly check: protocol logic
      # (CRC, frame building, decoding) is validated against captured frames in
      # seconds, independently of the firmware compile.
      - name: Configure
        run: cmake -S lib/phnix -B lib/phnix/build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build lib/phnix/build

      - name: Test
        run: ctest --test-dir lib/phnix/build --output-on-failure
